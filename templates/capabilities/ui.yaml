kind: capability_profile
id: capability.ui
version: 1.0.0
title: UI build-agent
role: ui
# RG-F: рецепт сборки UI-компонентов — полиморфный веер выбирает его по
# capability_owner = capability.ui. Специфика фронта (дизайн-токены, контракт
# API, состояния экрана) живёт в брифе рецепта, а не в ядре графа.
build_recipe: implementation.component_implementation_ui@1.0.0
capabilities:
  - capability: ui.web_spa
    tech: [React, TypeScript]
    requires:
      - Описание пользовательских потоков
    maturity: reliable
  - capability: ui.dashboards
    tech: [React, Recharts]
    requires:
      - Перечень метрик и источник данных
    maturity: reliable
cannot_do:
  - Нативные мобильные приложения (iOS/Android SDK)
  - Pixel-perfect без согласованного дизайн-макета
escalation: Дизайн-макеты запрашивать у продуктового дизайнера
