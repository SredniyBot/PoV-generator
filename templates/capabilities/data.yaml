kind: capability_profile
id: capability.data
version: 1.0.0
title: Data build-agent
role: data
# RG-F: рецепт сборки data-компонентов (полиморфный веер по capability_owner).
build_recipe: implementation.component_implementation_data@1.0.0
capabilities:
  - capability: data.pipeline
    tech: [Airflow, dbt]
    requires:
      - Описание источников и приёмников данных
    maturity: reliable
  - capability: data.warehouse
    tech: [ClickHouse, dbt]
    requires:
      - Модель аналитических витрин
    maturity: reliable
cannot_do:
