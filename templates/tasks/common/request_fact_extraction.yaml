kind: task_template
id: common.request_fact_extraction
version: 1.0.0
title: Выделить факты из запроса
type: leaf
status: active
domain: common
executor: llm
# Чистая экстракция — methodology с option_generation/decision не даёт
# полезного сигнала и засоряет reasoning-trace.
methodology: skip
requires:
  state: [business_request]
produces:
  artifact: common.request_fact_sheet@1.0.0
context:
  include: [state.business_request]
  max_tokens: 12000
planning:
  priority: 1000
effects:
  readiness:
    set:
      - dimension: request_facts_extracted
        status: ready
summary: |
  Извлеки фактическую базу проекта из бизнес-запроса. Это первый аналитический шаг —
  собрать то, что в запросе сказано ЯВНО, без интерпретаций и без выводов.

  Что искать:

  • КЛЮЧЕВЫЕ СУЩНОСТИ — люди, роли, отделы, системы, документы, бизнес-объекты,
    которыми оперирует решение. Имена / названия / роли — дословно.
  • ЧИСЛОВЫЕ ОРИЕНТИРЫ — все упомянутые числа: текущие и целевые показатели,
    горизонты, объёмы, частоты, сроки, бюджеты. С единицами и контекстом.
  • ОЖИДАЕМЫЕ РЕЗУЛЬТАТЫ — что заказчик хочет получить по факту. Цитируй формулировки
    из запроса как они есть.
  • ОГРАНИЧЕНИЯ — что нельзя или нужно соблюдать: размещение, технологический стек,
    регуляторные ссылки, организационные процессы, NDA, согласования.
  • УПОМЯНУТЫЕ СТЕЙКХОЛДЕРЫ — кто фигурирует в запросе и в какой роли.
  • ИСТОЧНИКИ ДАННЫХ — какие системы, файлы или процессы поставляют входы.

  Правила:
  • Только то, что сказано в бизнес-запросе. Если запрос говорит «снизить отток на
    7 п.п.» — фиксируй «-7 п.п.»; не пиши «значительное снижение». Если запрос про
    AI-юриста — извлекай факты про претензии, не про оттока.
  • Не интерпретируй: «нужна ML-модель» — это уже не факт, а вывод.
  • Не выдумывай. Если о чём-то не сказано — этого нет.
  • Каждый факт — одно короткое утверждение с конкретикой (число, имя системы,
    название роли) где они есть в запросе.

  Уровень: столько фактов, сколько содержит запрос. Лучше меньше, но точнее, чем
  больше, но «по мотивам». confidence высокая (0.85+) — это извлечение, не вывод.
