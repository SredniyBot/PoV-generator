summary: |
  Построй бизнес-обоснование проекта — ПОЧЕМУ его стоит делать — в виде, на
  который можно опираться при принятии решения. Это раздел про ценность:
  природа проблемы, ожидаемый эффект, что считаем успехом, риски ценности.

  ДЕНЬГИ И СРОКИ НЕ ОЦЕНИВАЕМ. Бюджет, стоимость, ROI, окупаемость, сроки —
  считают вне системы. Денежную/временну́ю величину приводи ТОЛЬКО если она
  явно названа в бизнес-запросе. Нет цифры в запросе — описывай эффект
  качественно и операционно (время цикла, ошибки, упущенные кейсы, доля
  автоматизации), а не в выдуманных рублях. Никаких «оценим параметрически»,
  «порядок ±30%», придуманных сумм и сценариев в деньгах.

  Структура:

  • ЦЕНА ПРОБЛЕМЫ. Что компания теряет от ОТСУТСТВИЯ решения, в терминах данной
    задачи. Денежная величина — только если она есть в запросе; иначе опиши
    потерю операционно (время, ошибки, риск, упущенные возможности) и пометь,
    что денежная оценка требует данных заказчика.
  • ОЖИДАЕМЫЙ ЭФФЕКТ. Что улучшится при минимально приемлемом результате.
    Метрика — по природе проекта: операционная (часы, скорость, доля
    автоматизированных кейсов, качество) или экономическая ТОЛЬКО при наличии
    цифр в запросе. Не выдумывай экономические сценарии.
  • БИЗНЕС-МЕТРИКИ УСПЕХА. Не технические метрики, а измеримые показатели
    бизнеса: время цикла, доля автоматических решений, конверсия, объём
    сэкономленных ресурсов, удержание клиентов, качество по экспертной оценке.
  • ВТОРИЧНЫЕ И НЕМАТЕРИАЛЬНЫЕ ЭФФЕКТЫ. Что улучшится помимо основного: скорость,
    репутация, удержание сотрудников, удовлетворённость клиентов. Не монетизируй.
  • ДОПУЩЕНИЯ И ЧУВСТВИТЕЛЬНОСТЬ. Что нужно, чтобы эффект материализовался, и от
    какого ключевого параметра он сильнее всего зависит (качественно).
  • РИСКИ ЦЕННОСТИ. Почему бизнес-результат может не материализоваться даже при
    технически успешном проекте — «продукт работает, но эффекта нет».

  Правила:
  • Эффект — конкретно по сути (что именно улучшится, в каких единицах природы
    проекта), а не «значительная экономия» и «многие пользователи».
  • Любые цифры — ТОЛЬКО из запроса. Денежные, бюджетные, ROI- и временны́е
    оценки не выдумывай (их считают вне системы). Не подставляй значения «по
    аналогии» с другими кейсами.
  • Опирайся на цели из goal_hypothesis и ограничения из constraint_inventory.

  confidence 0.6-0.8 (это прогноз).
