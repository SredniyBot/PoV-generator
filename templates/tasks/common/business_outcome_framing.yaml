summary: |
  Построй бизнес-кейс проекта в виде, на который можно опираться при принятии
  инвестиционного решения. Это раздел про экономическую обоснованность —
  конкретные эффекты, формулы, риск-сценарии.

  Структура:

  • ПРОБЛЕМА В ДЕНЕЖНОМ ВЫРАЖЕНИИ. Сколько компания теряет от ОТСУТСТВИЯ решения,
    в терминах данной задачи. Используй цифры из запроса; если их нет — оценивай
    параметрически и явно отмечай ассампшены.
  • ОЖИДАЕМЫЙ ЭФФЕКТ. Сколько компания получит при минимально приемлемом
    результате. Если применимо, дай 2-3 сценария: консервативный, средний,
    целевой. Эффект может быть экономическим (рубли) или операционным (часы,
    скорость, доля автоматизированных кейсов) — выбирай метрику, соответствующую
    природе проекта.
  • ROI И ОКУПАЕМОСТЬ. Сравни ожидаемый эффект с инвестицией. Если бюджет не
    зафиксирован — оцени порядок (±30%) и явно укажи, что уточняется.
  • БИЗНЕС-МЕТРИКИ УСПЕХА. Не технические метрики, а измеримые показатели
    бизнеса. Их природа зависит от проекта: время цикла, доля автоматических
    решений, конверсия, объём сэкономленных ресурсов, удержание клиентов,
    качество результата по экспертной оценке.
  • ВТОРИЧНЫЕ И НЕМАТЕРИАЛЬНЫЕ ЭФФЕКТЫ. Что улучшится помимо прямой экономии:
    скорость, репутация, удержание сотрудников, удовлетворённость клиентов.
    Не пытайся монетизировать всё подряд.
  • ДОПУЩЕНИЯ И ЧУВСТВИТЕЛЬНОСТЬ. Что нужно, чтобы расчёт сработал. Покажи, как
    меняется эффект при изменении ключевого параметра.
  • РИСКИ ЦЕННОСТИ. Почему бизнес-результат может не материализоваться даже при
    технически успешном проекте. Не путать с проектными рисками (срыв сроков и
    т.п.) — здесь именно «продукт работает, но эффекта нет».

  Правила:
  • Числа явно (валюта, единицы, объём), а не «значительная экономия» и «многие
    пользователи».
  • Цифры — только те, которые есть в запросе, или явные ассампшены с обоснованием.
    Не вставляй конкретные значения «по аналогии» с другими кейсами.
  • Опирайся на цели из goal_hypothesis и ограничения из constraint_inventory.

  confidence 0.6-0.8 (это прогноз).
