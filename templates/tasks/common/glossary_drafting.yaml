kind: task_template
id: common.glossary_drafting
version: 1.0.0
title: Составить глоссарий проекта
type: leaf
status: active
domain: common
executor: llm
methodology: skip
# v3.6: глоссарий — это рендеринг (термины + определения), не источник
# новых проектных решений. Identification генерирует только meta-шум
# («глубина глоссария», «включение пробельных терминов»).
decision_identification: false
requires:
  state: [business_request]
  artifacts:
    required:
      - common.normalized_request@1.0.0
    optional:
      - common.stakeholder_map@1.0.0
      - common.constraint_inventory@1.0.0
produces:
  artifact: common.glossary_terms@1.0.0
context:
  include:
    - artifact.common.normalized_request
    - artifact.common.stakeholder_map
    - artifact.common.constraint_inventory
  max_tokens: 16000
planning:
  priority: 540
effects:
  readiness:
    set:
      - dimension: glossary_drafted
        status: ready
summary: |
  Собери глоссарий — короткий словарь терминов проекта, чтобы у заказчика и
  подрядчика было общее понимание ключевых понятий. Это снимает споры
  в духе «что значит инцидент» / «что считаем оттоком» / «кто такой
  ведущий специалист» на старте, а не после первой неудачной приёмки.

  Что включать:

  ▸ ДОМЕННЫЕ ТЕРМИНЫ — слова и аббревиатуры из специфики бизнес-запроса.
    Если в брифе использован термин, который может пониматься по-разному
    в зависимости от компании или отрасли — включи его. Примеры по доменам
    (не вставляй в чужой контекст): «отток», «инцидент», «онбординг»,
    «маржа», «дебиторка», «контур доверия».

  ▸ РОЛИ — все роли пользователей, согласующих, операционных ролей, если
    их название неочевидно. Например: «логист vs менеджер по логистике»
    могут оказаться одной и той же ролью в одной компании и разными — в
    другой.

  ▸ СИСТЕМЫ И СОКРАЩЕНИЯ — корпоративные системы, упомянутые в брифе,
    с расшифровкой того, что они делают. Если используются английские
    сокращения (CRM, ERP, BPM, RBAC, ADFS) — включи с пояснением.

  ▸ МЕТРИКИ — формальные определения числовых показателей, упомянутых в
    целях. «Конверсия из X в Y» — определи формулу или способ измерения.

  По каждому термину:
  • `term` — каноническая форма (как пишется в документе)
  • `definition` — одно-два предложения определения
  • `category` (опционально) — «роль», «система», «метрика», «процесс»
  • `synonyms` (опционально) — другие написания, встречающиеся в брифе

  Правила:
  • Включай ТОЛЬКО термины, появляющиеся в бизнес-запросе или в upstream-
    артефактах. Не добавляй термины, которых нет в проекте.
  • Не пиши банальностей: «Пользователь — человек, использующий систему».
    Глоссарий нужен для НЕОЧЕВИДНЫХ или ДОМЕННЫХ терминов.
  • Если у термина в брифе есть конкретная формула или критерий — приводи
    его дословно.

  Уровень: 8-25 терминов типично. Лучше меньше, но точнее. confidence 0.8+.
