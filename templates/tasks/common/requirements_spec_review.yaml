kind: task_template
id: common.requirements_spec_review
version: 1.0.0
title: Провести ревью ТЗ
type: leaf
status: active
domain: common
executor: llm
# Ревью: только финальное decision-suжение; промежуточных стадий нет.
methodology: validation
# v3.6: review-задача — это судит уже принятые решения, не источник
# новых. Identification генерирует только meta-шум типа «глубина
# проверки», «строгость порога passed_with_remarks».
decision_identification: false
requires:
  state: [business_request]
  artifacts:
    required: [common.requirements_spec@1.0.0]
produces:
  artifact: common.review_report@1.0.0
context:
  include: [artifact.common.requirements_spec]
  max_tokens: 24000
planning:
  priority: 50
effects:
  readiness:
    set:
      - dimension: specification_reviewed
        status: ready
summary: |
  Проведи профессиональное ревью финального ТЗ. Ты — старший консультант,
  подписывающий документ перед отправкой заказчику.

  Чек-лист (для каждой категории — конкретные находки либо явное «ок»):

  • БИЗНЕС-СОДЕРЖАТЕЛЬНОСТЬ. Отвечает ли ТЗ на «зачем», «что получит бизнес», «как
    измерим успех»? Цели сформулированы измеримо? Не звучит ли документ как
    мета-описание процесса вместо описания проекта?
  • АРХИТЕКТУРНАЯ ЦЕЛОСТНОСТЬ. Компоненты решения покрывают цели? Нет ли
    заявленной функциональности без описания, как она реализуется?
  • ГРАНИЦЫ PoV. Чётко ли разделено, что в PoV и что нет? Нет ли в scope-in
    production-пунктов? Нет ли в scope-out того, без чего PoV не имеет смысла?
  • ИЗМЕРИМОСТЬ ПРИЁМКИ. Критерии приёмки проверяемы? Можно ли однозначно
    сказать «принято / не принято»?
  • РИСКИ. Рассмотрены типовые риски для класса проекта? Митигации не размыты?
  • БЮДЖЕТ И СРОКИ. Соответствуют ли объёму работ?
  • ДОМЕННЫЕ РАЗДЕЛЫ. Если активны domain packs — есть ли соответствующие разделы
    с конкретными требованиями (а не плейсхолдером)?
  • СОГЛАСОВАННОСТЬ. Не противоречат ли разделы друг другу? (Например, цель и
    критерии приёмки могут не сходиться по содержанию.)
  • КАЧЕСТВО ТЕКСТА. Нет ли канцелярита, водянистых формулировок («система
    должна обеспечивать качество»), мета-фраз про сам процесс?
  • КЕЙС-СПЕЦИФИЧНОСТЬ. Не вставлены ли в документ имена систем, законы, метрики
    или компоненты, которых нет в исходном бизнес-запросе? Это типичная ошибка
    «подгонки под чужой кейс».
  • ПРИГОДНОСТЬ К ПЕРЕДАЧЕ. Может ли реализационная команда взять документ и
    начать работу без 10 уточняющих вопросов?

  Структура отчёта:
  • overall_status: passed / passed_with_remarks / failed_needs_rework
  • confidence: 0.0-1.0
  • summary: 2-3 строки общего впечатления
  • strengths: список сильных сторон
  • findings: замечания с severity (critical / major / minor) + привязка к разделу
  • recommendations: конкретные правки (что и где переписать)

  Правила:
  • Мета-формулировки про сам процесс ТЗ — major, требует rework.
  • Scope-in и scope-out пересекаются или противоречат — critical.
  • Domain pack активен, но раздел плейсхолдерный — major.
  • Бизнес-кейс отсутствует или без чисел — major.
  • Кейс-наполнители (упоминания технологий или законов, которых нет в запросе) —
    major.
  • Каждая находка сопровождается предложением, как исправить.

  Документ без critical, с большинством категорий «ок» → passed_with_remarks.
  Полный passed — редкое явление. confidence 0.7-0.95.
