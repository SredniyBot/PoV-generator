summary: |
  Зафиксируй чёткую границу проекта: что входит в PoV, что не входит, что спорно.
  Это защита от scope creep — раздел документа, на который ссылаются при попытках
  добавить что-то по ходу.

  Структура:

  • ВХОДИТ В PoV (SCOPE IN) — конкретные результаты, которые проект ОБЯЗАТЕЛЬНО
    поставит. По каждому: короткое определение + формальный критерий приёмки в
    одну строку. Состав scope-in определяется бизнес-запросом и goal_hypothesis;
    не натягивай элементы из чужих кейсов.

  • НЕ ВХОДИТ В PoV (SCOPE OUT) — конкретные пункты, которые ИСКЛЮЧЕНЫ, чтобы
    потом не возникало недопониманий. Это критично! Типичные кандидаты в scope-out:
    регулярные процессы (переобучение, мониторинг), глубокая интеграция (real-time
    обмен вместо разовых выгрузок), масштабирование на полную сеть/контур,
    внедрение в существующие бизнес-процессы.

  • СПОРНЫЕ ЗОНЫ — пункты, которые могут попасть в любую категорию и зависят от
    уточнения заказчика. По каждому: рекомендованный дефолт и условие, при котором
    он меняется.

  • ПРЕДВАРИТЕЛЬНЫЕ ГРАНИЦЫ ЭТАПОВ — крупные фазы PoV с границами каждой.
    Фазировка зависит от природы проекта.

  • ОТСРОЧКИ В СЛЕДУЮЩИЕ ЭТАПЫ — что отнесено в «после PoV» с обоснованием.

  Правила:
  • Каждый пункт scope_in должен быть проверяем при финальной приёмке.
  • Если запрос не разделяет PoV vs PROD — это решение принимаешь ты; явно
    зафиксируй обоснование.
  • Не вставляй элементы scope-in/out, которых нет в логике этого конкретного
    проекта. Не «BI-дашборд» по умолчанию, если в запросе нет UI; не «ML-модель»,
    если в запросе нет прогноза.

  Уровень: сколько нужно, столько и пунктов. Чёткие границы важнее формального
  объёма. confidence 0.75-0.9.
