summary: |
  Сформулируй цель проекта так, как она должна звучать в коммерческом ТЗ — рабочее
  утверждение, на которое смотрит и заказчик, и реализационная команда.

  Опиши:

  • ЦЕЛЕВОЙ ЭФФЕКТ — что меняется для бизнеса. В терминах конкретной метрики и
    направления, опираясь на формулировки бизнес-запроса. Если в запросе сказано
    «снизить отток на 7 п.п.» — это и есть целевой эффект; если сказано «сократить
    цикл «просрочка → оплата»» — это и есть он. Не подменяй цель проекта на
    «улучшить процесс» или «повысить эффективность».
  • ИЗМЕРИМЫЙ KPI ВЕРХНЕГО УРОВНЯ — 2-4 показателя, по которым через несколько
    недель будут принимать решение об успехе. Используй то, что есть в запросе;
    если конкретных цифр нет — предложи разумные индикаторы и явно отметь, что они
    подлежат согласованию.
  • ГОРИЗОНТ — за какой период ждут эффект и в каком масштабе мерят.
  • КТО ПОДТВЕРЖДАЕТ УСПЕХ — конкретная роль или команда заказчика, принимающая
    результат (берётся из запроса).
  • ГРАНИЦА PoV vs PRODUCTION — что входит в текущий этап и что отнесено к
    следующим этапам. Если в запросе это не разделено — сделай разделение сам и
    зафиксируй.

  Правила:
  • Опирайся на 🟢 решения пользователя про KPI и масштаб, если они есть.
  • Не вставляй метрики или числа, которых нет в запросе и которые не следуют
    из логики домена.
  • Не используй чужие KPI-примеры (из других кейсов) — формулировки должны
    отражать именно этот запрос.
  • Если KPI в запросе размытые — предложи 2-3 рабочих интерпретации и выбери
    одну как основную, явно обосновав.

  Уровень: одна формулировка цели + список KPI + явное разделение PoV/PROD.
  confidence 0.7-0.85.
