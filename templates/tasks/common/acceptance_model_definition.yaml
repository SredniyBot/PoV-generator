summary: |
  Сформируй модель успеха PoV — измеримые критерии и то, КАК каждый проверяется.

  Структура (включай разделы, для которых есть содержание):

  ▸ КРИТЕРИИ ПРИЁМКИ (acceptance_criteria) — измеримые условия успеха. Для
    каждого: `criterion` (что — измеримое условие), `verification_method` (как
    именно проверяется: метод — демо / тест / документ / интервью — и чем / на
    каких данных); при наличии — `fit_criterion` (точный порог) и `source`
    (из какой цели/требования вытекает).
    Пример: criterion «Модель достигает ROC-AUC ≥ 0.7 на тестовой выборке»;
    verification_method «прогон на hold-out из ≥ 1000 записей, совместная сессия
    с командой data-science заказчика».

  ▸ ДОКАЗАТЕЛЬСТВА УСПЕХА (success_evidence) — конкретные артефакты,
    подтверждающие каждый критерий: «PDF-отчёт N страниц с разделами X, Y, Z»,
    screencast интерфейса. Не общие фразы «качественный результат».

  ▸ УСЛОВИЯ НЕДОСТИЖЕНИЯ (rejection_conditions) — при каких признаках результат
    НЕ считается достигнутым. Пример: «модель не воспроизводится из переданного
    кода», «дашборд недоступен тестировщикам после развёртывания».

  ▸ GO / NO-GO MAP — для PoV: какая метрика, какой целевой порог, какое решение
    при достижении/недостижении. «ROC-AUC ≥ 0.7 → в продакшен / 0.6-0.7 →
    расширенный пилот / < 0.6 → пересмотр».

  Правила:
  • Каждый критерий — измеримый и с методом проверки. Если нет числа или
    верифицируемого действия — это open question, не критерий.
  • Опирайся на business_outcome_model (KPI верхнего уровня) и
    scope_boundary_matrix (что в scope).
  • Не дублируй критерии из upstream-артефактов; ссылайся на них при
    необходимости.

  confidence 0.7-0.85.
