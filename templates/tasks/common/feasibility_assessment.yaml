kind: task_template
id: common.feasibility_assessment
version: 1.0.0
title: Оценить реализуемость частей проекта
type: leaf
status: active
domain: common
executor: llm
methodology: minimal
requires:
  state: [business_request]
  artifacts:
    required:
      - common.normalized_request@1.0.0
      - common.scope_boundary_matrix@1.0.0
      - common.solution_option_inventory@1.0.0
    optional:
      - common.constraint_inventory@1.0.0
      - common.implementation_dependency_plan@1.0.0
      - common.project_risk_register@1.0.0
    # Доменные артефакты-предпосылки (ml.data_landscape_assessment,
    # integration.*, security.*) — прямой сигнал о наличии данных/доступов,
    # на которых держится реализуемость. Подмешиваются автоматически.
    collect_optional:
      from_active_domain_packs: true
produces:
  artifact: common.feasibility_assessment@1.0.0
context:
  include: [artifact.*]
  max_tokens: 24000
planning:
  # Ниже аналитических агрегаторов (500-700), чтобы на входе уже были
  # реестр рисков / план зависимостей / топология, но выше финального
  # synthesis (100), чтобы оценка попала в итоговое ТЗ.
  priority: 300
effects:
  readiness:
    set:
      - dimension: feasibility_assessed
        status: ready
summary: |
  Оцени, какие части проекта из бизнес-запроса в принципе реализуемы. Это
  advisory-анализ (он ничего не блокирует) — честная карта «делаем / делаем
  при условии / под вопросом / не сделать», по которой заказчик и команда
  видят границу реального.

  ШАГ 1. ВЫВЕДИ ПЕРЕЧЕНЬ ЧАСТЕЙ. Не жди готового списка — собери его сам из
  входов: ключевые возможности/требования из normalized_request, пункты
  in_scope из scope_boundary_matrix, существенные элементы вариантов из
  solution_option_inventory. Объединяй дубли; гранулярность — крупные
  осмысленные части (5-12 типично), а не каждое предложение запроса.

  ШАГ 2. ПО КАЖДОЙ ЧАСТИ — ВЕРДИКТ по ДВУМ осям сразу:
  • ТЕХНИКА — можно ли это построить в принципе (технологии существуют,
    задача решаемая)?
  • ПРЕДПОСЫЛКИ — есть ли то, без чего часть не реализовать: данные,
    доступы к интеграциям/системам, компетенции, бюджет/сроки-ограничения.

  Вердикт feasibility — строго одно из:
  ▸ feasible    — реализуемо: и технически, и предпосылки есть/достижимы.
  ▸ conditional — реализуемо ПРИ УСЛОВИИ (укажи условие в prerequisites).
  ▸ uncertain   — недостаточно данных во входах, чтобы судить (так и скажи).
  ▸ infeasible  — не реализовать в рамках проекта (объясни почему в rationale).

  По каждой части заполни:
  • name        — название части/возможности.
  • origin      — откуда выведено (scope-пункт / вариант решения / запрос).
  • feasibility — один из четырёх вердиктов выше.
  • rationale   — 1-3 предложения обоснования. Для conditional/uncertain/
                  infeasible — ОБЯЗАТЕЛЬНО конкретно, почему.
  • blockers    — что мешает прямо сейчас (нет данных, нет доступа к
                  интеграции, жёсткое ограничение, предел технологии). Пусто
                  для чистого feasible.
  • prerequisites — что должно стать ПРАВДОЙ, чтобы часть реализовалась
                  (доступ к контуру, тестовая выгрузка, согласование формата,
                  компетенция). Это УСЛОВИЯ реализуемости, а не форма запроса
                  данных — формулируй каждое КОНКРЕТНО и проверяемо (не «описание
                  потоков», а «доступ к тестовому API CRM» / «согласованный формат
                  выгрузки заявок»). Для conditional — это и есть «условие».
                  Конкретные пользовательские запросы данных под сборку появятся
                  позже, на модели компонентов (там — поле requisites).
  • confidence  — 0..1, уверенность в самом вердикте.
  • covered_by  — id агента, чья способность покрывает часть. Если части нет
    покрытия — НЕ добавляй это поле (оставь отсутствующим, не пиши null).
  • matched_capability — id способности из контракта агента; так же опускай,
    если покрытия нет.

  ГРАУНДИНГ В КОНТРАКТАХ АГЕНТОВ. В контексте есть блок <agent_capabilities> —
  это зафиксированные, надёжные способности команды сборки. Опирайся на него, а
  не на «в теории LLM может всё»:
  • часть покрыта способностью агента и её предусловия (requires) подтверждены
    во входах → feasible; заполни covered_by и matched_capability;
  • покрыта, но предусловие НЕ подтверждено → conditional; невыполненные
    предусловия перечисли в prerequisites (и при необходимости в blockers);
  • часть попадает в cannot_do агента → infeasible, ограничение в blockers;
  • ни одна способность не покрывает часть → uncertain, blocker
    «нет агента с такой способностью»; covered_by/matched_capability опусти.

  ШАГ 3. СВОДКА.
  • overall_feasibility — feasible (всё реализуемо) / mixed (есть условные
    или неопределённые) / blocked (есть хотя бы одна infeasible-часть).
  • summary — 2-4 предложения: что точно делаем, что под условием, что вне
    рамок.

  ПРАВИЛА.
  • НЕ ВЫДУМЫВАЙ предпосылок. Если во входах нет подтверждения доступа к
    системе/данным — это не «feasible», а «conditional» (или «uncertain») с
    явным prerequisites, а не молчаливое допущение.
  • Реализуемость ≠ риск. Риск из project_risk_register — «что может пойти
    не так у того, что мы делаем»; здесь — «можно ли это вообще сделать».
    Не переписывай реестр рисков, опирайся на него как на сигнал.
  • Без markdown внутри строковых значений (никаких ```), чистый текст.

  confidence 0.7-0.85 при качественных upstream-артефактах.
