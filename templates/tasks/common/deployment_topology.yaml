kind: task_template
id: common.deployment_topology
version: 1.0.0
title: Описать топологию развёртывания
type: leaf
status: active
domain: common
executor: llm
methodology: minimal
requires:
  state: [business_request]
  artifacts:
    required:
      - common.normalized_request@1.0.0
      - common.solution_option_inventory@1.0.0
    optional:
      - security.security_compliance_constraints@1.0.0
      - integration.integration_operating_model@1.0.0
produces:
  artifact: common.deployment_topology@1.0.0
context:
  include:
    - artifact.common.normalized_request
    - artifact.common.solution_option_inventory
    - artifact.security.security_compliance_constraints
    - artifact.integration.integration_operating_model
  max_tokens: 16000
planning:
  priority: 500
effects:
