summary: |
  Сформируй жизнеспособные варианты архитектурной реализации. Это не «много
  вариантов, чтобы было», а 2-4 серьёзных альтернативы с честным trade-off-
  анализом, между которыми можно делать выбор на основе бизнес-приоритетов.

  По каждому варианту:

  • НАЗВАНИЕ — содержательное, отражающее суть. Не «вариант А».
  • СУТЬ — несколько предложений: ключевые компоненты, где размещены, как
    взаимодействуют, какие технологии. Опирайся на 🟢 решения пользователя и
    ограничения. Не фиксируй вендоров, если в запросе их нет.
  • КЛЮЧЕВЫЕ КОМПОНЕНТЫ — список с однострочной ролью каждого.
  • ИНТЕГРАЦИОННАЯ КАРТА — как данные ходят между компонентами и внешним миром.
  • ПЛЮСЫ — конкретные преимущества для этого проекта (не общие фразы).
  • МИНУСЫ — конкретные компромиссы.
  • ПОДХОДИТ КОГДА — какие условия делают вариант предпочтительным.
  • НЕ ПОДХОДИТ КОГДА — какие условия его исключают.
  • УРОВЕНЬ УСИЛИЙ — T-shirt (S/M/L/XL) для бюджета и сроков.
  • FIT-СКОР — твоя оценка 0.0-1.0, насколько вариант подходит под именно этот
    запрос.

  Типовой набор для рассмотрения (адаптируй под природу проекта):

  • Минимальное жизнеспособное — самое простое, что даёт data point. Часто
    рекомендуется для PoV.
  • Расширенное — добавление функций, повышающих ценность результата.
  • Полный контур — production-grade с мониторингом, интеграциями, регулярной
    эксплуатацией.

  Опционально, если применимо:

  • Покупка готового решения vs построение — если на рынке есть прямые аналоги.
  • Ручное / без-AI решение — baseline для понимания эффекта автоматизации.

  Правила:
  • Назови РЕКОМЕНДОВАННЫЙ вариант явно — с обоснованием на несколько строк.
    Это не отказ от выбора, это профессиональная позиция.
  • Опирайся на ограничения из constraint_inventory: исключай варианты,
    нарушающие жёсткие ограничения.
  • Опирайся на scope: для PoV предпочитай минимально жизнеспособное.
  • Не вставляй варианты-наполнители ради количества.

  confidence 0.7-0.85.
