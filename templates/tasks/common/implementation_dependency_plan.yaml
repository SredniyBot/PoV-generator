summary: |
  Сформируй план реализации PoV как УПОРЯДОЧЕННУЮ ПОСЛЕДОВАТЕЛЬНОСТЬ фаз с
  зависимостями: что за чем идёт и что чем блокируется. Это раздел ТЗ, по
  которому команда понимает порядок работ и точки синхронизации с заказчиком.

  СРОКИ НЕ ОЦЕНИВАЕМ. Никаких длительностей (недель, дней, спринтов), дат и
  дедлайнов — их считают вне системы, любая такая оценка здесь была бы выдумкой.
  План — это ПОРЯДОК и ЗАВИСИМОСТИ, а не календарь.

  Структура:

  ▸ ФАЗЫ (phases) — крупные блоки работы в порядке выполнения. Для каждой:
    «Название. Цель фазы. Ключевые результаты». Без длительности.
    Типовая декомпозиция PoV: подготовка → анализ и моделирование →
    демонстрация и валидация → поставка и приёмка. Адаптируй под природу
    проекта; порядок определяется зависимостями, не временем.

  ▸ MILESTONES (key_milestones) — контрольные СОБЫТИЯ между фазами или внутри
    них (не даты). Каждая milestone — формальное событие: «Демо MVP заказчику»,
    «Прохождение валидационной выборки», «Подписание акта приёмки фазы 1».

  ▸ ЗАВИСИМОСТИ (dependencies) — что блокирует или предшествует чему.
    Формат: «<задача> требует <условие>». Например: «Запуск ML-обучения
    требует получения обезличенной выгрузки из 1С ЗУП», «Демо BI-дашборда
    требует утверждения дизайн-макета HR-командой».

  ▸ КРИТИЧЕСКИЙ ПУТЬ (critical_path) — последовательность зависимостей,
    срыв любой из которых блокирует финал PoV (порядок звеньев, без сроков).

  ▸ ВХОДЫ ОТ ЗАКАЗЧИКА (customer_inputs) — что должен предоставить заказчик и к
    какому ШАГУ это нужно (привязка к фазе, не к дате). «Обезличенная выгрузка —
    до старта фазы моделирования», «Доступ к тестовому контуру — до первой демо».

  ▸ ТРИГГЕРЫ ОСТАНОВКИ (stop_conditions) — формальные условия, при
    которых PoV приостанавливается досрочно. «Качество данных ниже
    минимально пригодного по результатам EDA», «Заказчик не предоставил
    выгрузку, необходимую для старта фазы моделирования».

  Правила:
  • НИКАКИХ длительностей, дат, дедлайнов и привязок к неделям/спринтам/дням.
    Если просится «когда» — переформулируй в «после чего» (зависимость).
  • Каждая фаза имеет проверяемый result, не «работаем над X».
  • Опирайся на scope_boundary_matrix и solution_option_inventory.
    Не вставляй фазы для работы, выходящей за scope.

  confidence 0.7-0.85.
