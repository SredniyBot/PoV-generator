kind: task_template
id: common.requirements_spec_generation
version: 1.0.0
title: Подготовить структурированное ТЗ
type: leaf
status: active
domain: common
executor: llm
# Этап 5: финальный ТЗ — синтетический merge всех аналитических артефактов.
# LLM интегрирует пересекающиеся темы (scope/stakeholders/options/...)
# в связный документ. Strategy=synthetic не меняет путь исполнения,
# но фиксирует семантику в метаинформации артефакта (для UI/provenance)
# и валидаторов merge-инвариантов.
merge:
  strategy: synthetic
  conflict_policy: union
requires:
  state: [business_request]
  artifacts:
    required:
      - common.normalized_request@1.0.0
      - common.business_outcome_model@1.0.0
      - common.scope_boundary_matrix@1.0.0
      - common.stakeholder_map@1.0.0
      - common.solution_option_inventory@1.0.0
    optional: []
    # Этап 7.3: вместо hand-coded списка optional всех доменных артефактов
    # — декларативный auto-collect. Любая задача активного доменного
    # пака (origin_kind=domain_contribution) подмешивает свой primary
    # артефакт в optional-контекст автоматически. Новый домен → попадает
    # в ТЗ без правки этого файла.
    collect_optional:
      from_active_domain_packs: true
produces:
  artifact: common.requirements_spec@1.0.0
context:
  include: [artifact.*]
  max_tokens: 64000
planning:
  priority: 100
effects:
  readiness:
    set:
      - dimension: specification_drafted
        status: ready
summary: |
  Это финальная сборка коммерческого ТЗ. Тебе на вход поступают все аналитические
  артефакты (нормализованный запрос, цели, бизнес-обоснование, scope, стейкхолдеры,
  варианты архитектуры, доменные разделы). Твоя задача — собрать их в связный
  проектный документ для заказчика.

  ЭТО НЕ МЕТА-ДОКУМЕНТ ПРО ТЗ. Это сам проектный документ — текст, по которому
  заказчик принимает решение запустить проект, а реализационная команда — берёт
  его и работает. Нигде не пиши «система должна формировать структурированное
  ТЗ»; пиши, что делает РЕШЕНИЕ из бизнес-запроса.

  РАЗДЕЛЫ ТЗ. Базовый набор, который применим к большинству консалтинговых PoV.
  Включай те разделы, для которых в upstream-артефактах есть содержание; не
  заполняй раздел generic-шаблоном ради формальности.

  • Executive summary — короткий абзац: что за проект, какой эффект, рамки.
  • Понимание задачи — что нужно создать, цели системы, бизнес-процессы, на
    которые проект влияет, ожидаемые бизнес-метрики.
  • Текущая ситуация — контекст заказчика, ключевые проблемы, доступные источники
    и заинтересованные стороны.
  • Предлагаемое решение — границы PoV, компоненты системы, методология работ,
    разделение данных или процессов (если применимо).
  • Схема реализации — общая архитектура, поток данных или взаимодействий, этапы
    работ с привязкой по неделям.
  • Результат и критерии приёмки — список результатов и измеримых критериев.
  • Оценка бюджета — структура и итог (детализация — насколько позволяют
    artefacts).
  • Бизнес-обоснование — формула эффекта, пример расчёта, окупаемость.
  • Технические требования и ограничения — компактно из constraint_inventory и
    доменных артефактов.
  • Риски — таблица «Риск / Вероятность / Влияние / Митигация».
  • Следующие шаги.
  • Перспектива масштабирования — что в следующих этапах.

  ДОМЕННЫЕ ВКЛАДЫ. Если для проекта активны domain packs, их разделы
  подмешиваются автоматически (frontend → требования к интерфейсу; ml →
  ML-задача и данные; integration → интеграции; security → ИБ и комплаенс).
  Включай их СОДЕРЖАНИЕ, а не плейсхолдеры; если содержания нет — раздел
  опускай.

  ПРАВИЛА КАЧЕСТВА.

  • СОДЕРЖАТЕЛЬНО, А НЕ МЕТА. «Система должна формировать структурированное ТЗ» —
    запрещено. Пиши, что делает РЕШЕНИЕ в этом конкретном проекте.
  • ЦИТИРУЙ КОНКРЕТИКУ ИЗ ЗАПРОСА. Имена систем, числа, роли — те, которые реально
    упоминаются. Не вставляй имена, не упомянутые в запросе.
  • НЕ ТЕРЯЙ ФАКТУРУ. Если в business_outcome_model посчитан эффект с конкретными
    цифрами — он должен быть в финальном ТЗ.
  • НЕ РАЗМЫВАЙ. «Допустимы выгрузки или API» — формулировка-уход. Лучше:
    «PoV работает на разовых обезличенных CSV-выгрузках; регулярная интеграция —
    следующий этап».
  • НЕ ВЫДУМЫВАЙ. Если данных в upstream нет — раздел компактный, явно отмечен в
    reasoning.
  • НЕ ПОДГОНЯЙ ПОД ЧУЖОЙ КЕЙС. Не вставляй компоненты (ML-модель, BI-дашборд,
    LLM-блок и т.п.), если в данном бизнес-запросе их нет. Структура документа гибкая.

  ОЧЕНЬ ВАЖНО — ФОРМАТ КОНТЕНТА ПОЛЕЙ СХЕМЫ.

  Артефакт — это документ для человека, не сериализованный JSON. Большинство полей
  схемы — массивы строк, но это НЕ значит, что каждая строка = телеграфный bullet.
  Качественный документ — это смесь форматов.

  • ПРОЗА (текстовые поля схемы: executive_summary, business_context, business_goal,
    prediction_target, prediction_horizon, prediction_unit, refresh_model): пиши
    абзацами по 3-7 предложений со связной логикой, как раздел инвестиционного
    меморандума. Никаких однострочных лозунгов и никаких bullet'ов внутри одного
    строкового поля.

  • БОГАТЫЕ ПУНКТЫ СПИСКА (массивы success_criteria, functional_requirements,
    non_functional_requirements, risks, assumptions, alternatives_considered,
    user_stories, target_outcomes, acceptance_criteria, delivery_artifacts,
    integration_requirements, security_requirements, deployment_requirements,
    phased_plan, stakeholders, open_questions): каждый item — НЕ короткая фраза,
    а развёрнутая формулировка из 1-3 предложений: с контекстом, с цифрами, с
    обоснованием. Пользователь должен прочесть одну строку и понять суть.

    Плохой пример: «Снижение оттока на 7 п.п.»
    Хороший пример: «Снижение годового оттока розничного персонала на 7 процентных
    пунктов — основной экономический эффект, на который рассчитан проект; цифра
    подтверждается на валидационной выборке заказчика и переводится в денежный
    эквивалент через стандартную стоимость замены сотрудника.»

  • РИСКИ — формат «Категория. Описание. Митигация:». Пример:
    «Качество данных. Низкая полнота НСИ в источниках приведёт к падению
    предсказательной способности модели. Митигация: ранний EDA на pilot-выгрузке,
    промежуточный отчёт заказчику с честной оценкой пригодности данных.»

  • АЛЬТЕРНАТИВЫ — формат «Название. Суть. Почему отвергнуто (или: при каких условиях
    стоит вернуться):». Не «вариант A / вариант B» в один присест.

  • ПОЛЬЗОВАТЕЛЬСКИЕ СЦЕНАРИИ — мини-history в одном пункте, 4-8 шагов через ;
    или арабские цифры: «Сценарий 1. <роль>. <цель>. 1) … 2) … 3) …»

  • СТЕЙКХОЛДЕРЫ — формат «Роль. Интерес. Влияние. Что делает в проекте.»

  ПРОВЕРКА. Когда закончишь — мысленно прочитай документ глазами клиента. Если он
  читается как «набор фраз через дефис» или как 10 одинаковых bullet-листов один за
  другим — переписывай items длиннее и связнее. Хороший ТЗ — это связный текст с
  ритмом «абзац прозы → таблица параметров → подробный список с обоснованиями»,
  а не «список → список → список».

  Объём — столько, сколько нужно для качественной передачи проекта. Краткость
  лучше воды; полнота лучше пропуска критичных тем.

  Не путай ФОРМАТ ТЗ (структура документа) и СОДЕРЖАНИЕ (что в нём написано).
  Структура — гибкая под природу проекта; содержание — извлекается из upstream-
  артефактов. Если в upstream-артефактах пробелы — фиксируй это явно в
  blocking_questions с severity=high, не подменяй пробел общими словами.

  confidence 0.75-0.9 при качественных upstream-артефактах.
