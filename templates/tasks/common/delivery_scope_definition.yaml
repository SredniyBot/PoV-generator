summary: |
  Определи состав поставки PoV — какие результаты решение производит как итог
  этапа. Описывай результаты, а не обязательства.

  Структура:

  ▸ DELIVERY_ITEMS — конкретные результаты решения. Для каждого: «Название
    (тип артефакта). Назначение. Формат и носитель».
    Примеры (адаптируй под природу проекта):
    — «Исходный код решения. Git-репозиторий с README и инструкцией запуска».
    — «Обученная модель и веса. Файл .pkl/.joblib + Dockerfile».
    — «BI-дашборд, развёрнутый в контуре заказчика. URL + роли».
    — «Отчёт о PoV. PDF со структурой <X>».
    — «Презентация финальной демо. Slide deck + видео-запись».

  ▸ DEMO_EXPECTATIONS — формат финальной демонстрации.
    «Live-сессия: разбираем 3 типовых кейса; включает QA-сессию».

  ▸ EVIDENCE_ARTIFACTS — доказательства пройденных критериев приёмки: какие
    документы / скриншоты / логи / отчёты валидации прилагаются.

  Правила:
  • Опирайся на scope_boundary_matrix: всё, что in-scope, имеет соответствующий
    результат.
  • Каждый item — СЧИТАЕМЫЙ: не «отчёт», а «PDF-отчёт со структурой 1-N».

  confidence 0.75-0.9.
