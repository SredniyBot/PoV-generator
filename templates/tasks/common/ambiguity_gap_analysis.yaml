summary: |
  Найди пробелы, неоднозначности и противоречия в бизнес-запросе. Это страховка от
  поздних переделок: всё, что может быть понято двояко, должно быть зафиксировано
  здесь.

  Категории находок:

  • ПРОБЕЛЫ ВВОДНЫХ ДАННЫХ — то, что не уточнено, но без чего архитектурное
    решение не сложить: масштаб пилотной выборки, состав источников, форматы
    выгрузок, наличие эталонной разметки, разделение train/test/validation если
    применимо.
  • НЕОДНОЗНАЧНЫЕ ФОРМУЛИРОВКИ — где одни слова значат разное. Пример: «работает на
    новых данных» может означать онлайн-инференс, регулярное переобучение или
    просто свежий батч-запуск.
  • ПРОТИВОРЕЧИЯ — где две части запроса говорят разное (например, формулировки
    про обезличивание не согласуются с описанием состава полей).
  • УПУЩЕННЫЕ ТЕМЫ — типичные для домена вопросы, не затронутые в запросе.
    Используй здравый смысл по домену, не привнося чужие кейсы.
  • БЕЗОПАСНЫЕ ДОПУЩЕНИЯ — для каждого пробела предложи рабочий дефолт, на
    котором проект может идти БЕЗ ответа пользователя. Дефолт должен быть
    минимально-инвазивным и явно отмеченным как assumption.
  • КАНДИДАТЫ В BLOCKING_QUESTIONS — только то, без чего архитектура принципиально
    невозможна. Не выноси сюда детали выбора инструментов; выноси решения о
    предмете и границах проекта.

  Правила:
  • На каждый пробел — поле default_assumption, чтобы система могла продолжать.
  • Severity: critical — архитектурно-блокирующее (без ответа артефакты неверны);
    high — заметно влияет на ревью; medium/low — детальный дизайн.
  • Visibility: principal — бизнес-решения (цели, scope, бюджет); architectural —
    подход и контур; technical — детали реализации.
  • Не выдумывай пробелы там, где запрос даёт ответ. Не плоди вопросы ради
    объёма.

  confidence 0.7-0.85.
