kind: task_template
id: common.request_normalization
version: 1.0.0
title: Разобрать запрос
type: leaf
status: active
# ТЗ v2: слит разбор запроса (нормализация + факты + неоднозначности/пробелы) в
# один шаг. Это синтез + извлечение фактов/пробелов = анализ (класс standard,
# не trivial).
domain: common
executor: llm
methodology: minimal
requires:
  state: [business_request]
  artifacts:
    required:
      - common.goal_hypothesis@1.0.0
      - common.constraint_inventory@1.0.0
produces:
  artifact: common.normalized_request@1.0.0
context:
  max_tokens: 24000
planning:
  priority: 900
effects:
  readiness:
    set:
      - dimension: request_normalized
        status: ready
summary: |
  Разбери бизнес-запрос в единую каноническую модель: это базовый артефакт, на
  который опираются все последующие задачи. В одном шаге сделай:
  • извлеки явные факты из запроса (explicit_facts) — имена систем, роли,
    источники, цифры, прямо названные в запросе (не выдумывай);
  • найди неоднозначности и пробелы (ambiguous_points) — что непонятно/не задано;
  • зафиксируй рабочие допущения по пробелам (safe_assumptions) — осторожно,
    только разумные, без выдуманных чисел/сроков;
  • опираясь на гипотезу цели и ограничения (upstream), собери остальную модель.
  Это базовый артефакт, на который опираются все последующие задачи.

  Структура (включай те секции, для которых есть содержание):

  • ЧТО ПРОЕКТ ДЕЛАЕТ — одна-две формулировки в стиле описания продукта, а не
    методологии. Опирайся на цели и factual base; пиши про предмет, не про процесс.
  • КОНТЕКСТ — несколько строк о домене, текущей ситуации, исходной проблеме.
    Конкретика: имена, роли, числа.
  • ЦЕЛИ И БИЗНЕС-ЭФФЕКТЫ — структурированный блок «Цель → Описание → Показатель»
    на основе goal_hypothesis.
  • КЛЮЧЕВЫЕ КОМПОНЕНТЫ РЕШЕНИЯ — список компонент с однострочным назначением.
    Если домен предполагает ML/BI/API/UI — включай соответствующие компоненты;
    если нет — не натягивай чужую архитектуру.
  • ВХОДЫ И ВЫХОДЫ — какие данные принимаем (источники, форматы), что отдаём
    (артефакты, доступы, документы).
  • ОГРАНИЧЕНИЯ ТЕЛЕГРАФНО — несколько жёстких ограничений из constraint_inventory.
  • РАЗДЕЛЕНИЕ PoV vs PRODUCTION — что входит в текущий этап, что отнесено к
    следующим.
  • КЛЮЧЕВЫЕ СТЕЙКХОЛДЕРЫ — компактный блок (полная карта будет в следующих
    задачах).

  Правила:
  • Это синтез, а не пересказ. Если upstream-артефакты говорят разное — выбирай
    более конкретное и обосновывай выбор в reasoning.
  • НЕ дублируй полный текст бизнес-запроса; нужна компактная каноническая
    модель.
  • Не натягивай домен, которого нет в запросе. Если в запросе нет ML — не
    придумывай ML-компоненты. Если нет BI — не пиши про дашборды.
  • Цитируй конкретику из бизнес-запроса: имена систем, числа, роли — те,
    которые там реально есть.

  confidence 0.8+.
