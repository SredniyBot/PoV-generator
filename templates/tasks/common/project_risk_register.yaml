summary: |
  Собери единый реестр рисков PoV — то, что может пойти не так, и как с этим
  обращаться. Это агрегатор: тащи риски из upstream-артефактов (constraints,
  business outcome, scope, implementation plan) и дополняй типовыми для
  природы проекта.

  Структура каждого риска:

  ▸ TITLE — короткая формулировка (1 строка)
  ▸ CATEGORY — тип: «качество данных», «организационный», «технический»,
    «комплаенс», «ценность для бизнеса», «зависимость от заказчика»,
    «срок поставки»
  ▸ DESCRIPTION — 1-2 предложения о сути риска
  ▸ PROBABILITY — low / medium / high
  ▸ IMPACT — low / medium / high
  ▸ MITIGATION — конкретное действие для снижения вероятности или
    последствий («ранний EDA для оценки качества данных к концу недели 1»)
  ▸ TRIGGER — что считается признаком наступления риска и поводом
    к остановке/эскалации
  ▸ OWNER — кто отвечает за митигацию (роль из stakeholder-map)

  Правила:
  • Не дублируй риски из одного upstream-артефакта; агрегируй похожие.
  • Не выдумывай риски «для красоты». Каждый риск либо упомянут в
    upstream, либо очевидно следует из специфики проекта PoV.
  • Каждый риск должен иметь митигацию. «Митигация: следить» — это не
    митигация; конкретное действие — да.
  • Для high/high рисков укажи trigger (формальный критерий остановки).

  Уровень: 5-12 рисков типично. confidence 0.7-0.85.
