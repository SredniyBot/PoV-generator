id: common.project_risk_register
version: 1.0.0
title: Собрать реестр рисков проекта
type: leaf
status: active
domain: common
executor: llm
methodology: minimal
requires:
  state: [business_request]
  artifacts:
    required:
      - common.normalized_request@1.0.0
      - common.constraint_inventory@1.0.0
    optional:
      - common.business_outcome_model@1.0.0
