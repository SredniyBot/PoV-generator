summary: |
  Собери ограничения проекта — то, что нельзя обойти и нужно учесть на архитектурном
  уровне. Это «что обязательно», а не «что хочется».

  Категории (рассматривай те, которые применимы; не вытягивай категорию, если в
  запросе для неё нет содержания):

  • РЕГУЛЯТОРНЫЕ И ПРАВОВЫЕ — нормативные акты, отраслевые требования, регуляторы
    применимой юрисдикции, на которые ссылается бизнес-запрос или которые
    очевидно применимы по контексту проекта. Цитируй ссылки дословно как они в
    запросе; не вставляй акты «по умолчанию».
  • ОРГАНИЗАЦИОННЫЕ — кто согласует, формальные процессы, NDA, сроки, состав
    команды.
  • ТЕХНИЧЕСКИЕ И ИНФРАСТРУКТУРНЫЕ — стек обязательный или запрещённый, среда
    развёртывания, ограничения на исходящий трафик, требования к
    производительности.
  • ДАННЫЕ — какие источники доступны, формат, глубина истории, ограничения на
    передачу, известное качество.
  • ИНТЕГРАЦИОННЫЕ — наличие готовых интерфейсов, режим взаимодействия (пакетный
    или потоковый), регулярность.
  • БЮДЖЕТНЫЕ И ВРЕМЕННЫЕ — границы бюджета, сроки этапов, доступные ресурсы.
  • ГРАНИЦЫ ИЗМЕНЯЕМОСТИ — что нельзя менять (существующие бизнес-процессы,
    юридически значимые потоки документов, расчётные правила), что open.

  Правила:
  • Каждое ограничение — короткая формулировка + ссылка на источник (где это
    сказано в запросе или какое решение пользователя это устанавливает).
  • Не путай ограничение с пожеланием. «Хотим современные модели» — пожелание;
    «нельзя передавать персональные данные в публичный LLM» — ограничение.
  • Не выдумывай ограничения, которых нет в запросе. Если запрос не упоминает
    регулятор — не добавляй его «по аналогии».
  • Если ограничение противоречит другому или решению пользователя — фиксируй
    его явно в тексте артефакта с пометкой о конфликте. Решение по такому
    конфликту запрашивается у пользователя отдельно — через реестр решений.

  Уровень: столько ограничений, сколько реально присутствует в запросе и логично
  для домена. Лучше меньше, но точнее. confidence 0.75-0.9.
