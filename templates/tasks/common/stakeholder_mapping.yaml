summary: |
  Опиши реальную карту стейкхолдеров проекта — кто кого затрагивает, у кого какой
  интерес, кто принимает решения. Это рабочая модель организационной и
  политической структуры вокруг проекта, а не список должностей.

  По каждому стейкхолдеру укажи:

  • КТО — конкретно (роль, отдел, команда), настолько детально, насколько
    позволяет бизнес-запрос.
  • ИНТЕРЕС В ПРОЕКТЕ — почему ему важно, неудобно или безразлично, чтобы PoV
    случился.
  • РОЛЬ В ПРОЕКТЕ — что КОНКРЕТНО делает (принимает решение, предоставляет
    данные, согласует размещение, проверяет приёмку, обучает пользователей).
  • ВЛИЯНИЕ — может ли блокировать (high), тормозить (medium), советовать (low).
    Влияет на коммуникационный план.
  • ОЖИДАНИЯ — что считает успехом он лично. Этот пункт критично зафиксировать,
    если ожидания расходятся с формальным KPI проекта.
  • РИСК ВЗАИМОДЕЙСТВИЯ — типичный паттерн проблем и митигация.

  Категории, которые имеет смысл рассмотреть (включай только применимые):

  • Заказчик / Sponsor — кто финансирует, кто принимает финальное решение.
  • Владелец бизнес-процесса — чей процесс трогаем.
  • ИТ / Инфраструктура — кто отвечает за развёртывание и эксплуатацию.
  • ИБ / Комплаенс — кто валидирует регуляторику, доступ, размещение.
  • Владельцы данных — кто согласует выгрузки и доступы к источникам.
  • Конечные пользователи — кто реально работает с результатом проекта.
  • Операционные роли — кто эксплуатирует решение после поставки.
  • Внешние стороны — партнёры, регулятор, контрагенты — если применимо.

  Правила:
  • Имена и роли — настолько конкретно, насколько позволяет бизнес-запрос. Не
    выдумывай команды, которых там нет.
  • Каждый стейкхолдер должен фигурировать в каком-то этапе проекта. Если о нём
    никто не вспомнит при реализации — он лишний.
  • Если стейкхолдер влияет на критерии успеха — отметь явно.

  confidence 0.75-0.9.
