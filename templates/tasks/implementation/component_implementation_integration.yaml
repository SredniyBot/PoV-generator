kind: task_template
id: implementation.component_implementation_integration
version: 1.0.0
title: Реализация integration-компонента агентом
type: leaf
status: active
domain: implementation
# RG-F: рецепт сборки капабилити integration (полиморфный веер по
# capability_owner = capability.integration). Та же роль — отличие в брифе.
executor: harness
harness_output: bundle
methodology: minimal
requires:
  state: [business_request]
  artifacts:
    required:
      - implementation.project_scaffold@1.0.0
      - implementation.component_build_spec@1.0.0
      - architecture.component_model@1.0.0
    optional:
      - implementation.build_manifest@1.0.0
      - architecture.interaction_view@1.0.0
      - common.normalized_request@1.0.0
produces:
  artifact: implementation.component_implementation@1.0.0
harness_gates:
  - name: smoke
    command: "test -d src || test -f README.md"
context:
  include: [artifact.*]
  max_tokens: 24000
planning:
  priority: 400
summary: |
  Реализуй ОДИН integration-компонент (адаптер к внешней системе) по его спеке
  сборки, встроив его в готовое общее ядро. Какой именно — в «Целевой элемент
  (фокус задачи)». Работай ТОЛЬКО по нему.

  Сначала прочти ядро в корне: AGENTS.md, CONVENTIONS.md/STACK.md, /contracts/
  (контракт внешнего обмена и контракт, который ты предоставляешь соседям).

  Положи код ТОЛЬКО в зону своего сервиса (services/<сервис>/...):
  • клиент/адаптер к внешней системе по её контракту (конфиг — через env);
  • идемпотентность, ретраи и таймауты; обработка ошибок по конвенции;
  • мок внешней системы для локального запуска и теста (без реальных секретов);
  • минимальный тест round-trip против мока.

  Секреты НЕ хардкодь — только через env. НЕ трогай чужие зоны, корневые файлы и
  контракты. Чего не хватает — отметь в README компонента.
