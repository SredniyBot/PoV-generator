kind: task_template
id: implementation.build_plan_synthesis
version: 1.0.0
title: Сводный план реализации
type: leaf
status: active
domain: implementation
executor: llm
methodology: minimal
merge:
  strategy: synthetic
  conflict_policy: union
requires:
  state: [business_request]
  artifacts:
    required:
      - architecture.component_model@1.0.0
    optional:
      - implementation.component_build_spec@1.0.0
      - common.feasibility_assessment@1.0.0
produces:
  artifact: implementation.build_plan@1.0.0
context:
  include: [artifact.*]
  max_tokens: 48000
planning:
  priority: 100
summary: |
  Собери сводный план реализации из покомпонентных спек сборки
  (implementation.component_build_spec — по одной на компонент) и feasibility.
  Поля артефакта:
  • routing — строка на каждый компонент: part = компонент, agent =
    capability_owner (умение-владелец), capability = умение, status (готово к
    сборке / при условии / вне зоны / не покрыто);
  • sequencing — очерёдность фаз по зависимостям компонентов (из dependencies);
  • per_agent — сводка по каждому УМЕНИЮ (agent = умение): число компонентов,
    ключевое. Это представление-сводка; ось генерации — по компонентам;
  • risks_and_gaps — непокрытое из feasibility + out_of_scope/open_questions спек;
  • executive_summary — короткий абзац: что и как строим, что под условием, что
    вне рамок.
  Не выдумывай компоненты, которых нет в покомпонентных спеках или архитектуре.
