kind: task_template
id: implementation.component_implementation_backend
version: 1.0.0
title: Реализация backend-компонента агентом
type: leaf
status: active
domain: implementation
# RG-F: рецепт сборки капабилити backend (полиморфный веер по capability_owner =
# capability.backend). Та же роль component_implementation — отличие в брифе.
executor: harness
harness_output: bundle
methodology: minimal
requires:
  state: [business_request]
  artifacts:
    required:
      - implementation.project_scaffold@1.0.0
      - implementation.component_build_spec@1.0.0
      - architecture.component_model@1.0.0
    optional:
      - implementation.build_manifest@1.0.0
      - architecture.interaction_view@1.0.0
      - common.normalized_request@1.0.0
produces:
  artifact: implementation.component_implementation@1.0.0
harness_gates:
  - name: smoke
    command: "test -d src || test -f pyproject.toml || test -f package.json || test -f README.md"
context:
  include: [artifact.*]
  max_tokens: 24000
planning:
  priority: 400
summary: |
  Реализуй ОДИН backend-компонент по его спеке сборки, встроив его в готовое
  общее ядро. Какой именно — в «Целевой элемент (фокус задачи)». Работай ТОЛЬКО
  по нему.

  Сначала прочти ядро в корне: AGENTS.md, CONVENTIONS.md/STACK.md (стек и версии),
  /contracts/ (контракт, который ТЫ предоставляешь, и контракты соседей, которые
  потребляешь — строй против них).

  Положи код ТОЛЬКО в зону своего сервиса (services/<сервис>/...):
  • реализацию provided_interfaces строго по контракту /contracts/ (валидация
    входа, коды ошибок по конвенции);
  • слой данных (модели/миграции) для owned_data, если компонент владеет данными;
  • адаптеры к потребляемым сервисам — по их контрактам (адрес через имя сервиса);
  • модули в порядке internal_edges; минимальный unit + contract-тест.

  Нужные библиотеки объявляй в манифесте зависимостей сервиса (requirements.txt/
  package.json) — их поставит Dockerfile при сборке; не считай их уже стоящими.

  НЕ трогай чужие зоны, корневые файлы и контракты. Не выходи за контракт; чего
  не хватает — отметь в README компонента.
