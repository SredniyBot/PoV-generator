kind: task_template
id: implementation.component_implementation_ml
version: 1.0.0
title: Реализация ML-компонента агентом
type: leaf
status: active
domain: implementation
# RG-F: рецепт сборки капабилити ML (полиморфный веер по capability_owner =
# capability.ml). Та же роль component_implementation — отличие в брифе.
executor: harness
harness_output: bundle
methodology: minimal
requires:
  state: [business_request]
  artifacts:
    required:
      - implementation.project_scaffold@1.0.0
      - implementation.component_build_spec@1.0.0
      - architecture.component_model@1.0.0
    optional:
      - implementation.build_manifest@1.0.0
      - common.normalized_request@1.0.0
produces:
  artifact: implementation.component_implementation@1.0.0
harness_gates:
  - name: smoke
    command: "test -d src || test -f pyproject.toml || test -f requirements.txt || test -f README.md"
context:
  include: [artifact.*]
  max_tokens: 24000
planning:
  priority: 400
summary: |
  Реализуй ОДИН ML-компонент по его спеке сборки, встроив его в готовое общее
  ядро. Какой именно — в «Целевой элемент (фокус задачи)». Работай ТОЛЬКО по нему.

  Сначала прочти ядро в корне: AGENTS.md, CONVENTIONS.md/STACK.md (стек ML и
  версии), /contracts/ (контракт данных-входа и формат ответа сервиса инференса —
  строй против них).

  Положи код ТОЛЬКО в зону своего сервиса (services/<сервис>/...):
  • пайплайн данных/признаков из доступных данных (без «магических» источников);
  • обучение/инференс по подходу из спеки; фиксируй seed и версии для
    воспроизводимости;
  • протокол оценки: метрика и валидация из спеки; короткий прогон-проверка;
  • сервис инференса по контракту /contracts/ (вход/выход строго по формату);
  • минимальный тест пайплайна (прогон на сэмпле).

  Не обещай точность сверх данных; ограничения и допущения — в README компонента.
  НЕ трогай чужие зоны, корневые файлы и контракты.
