kind: task_template
id: implementation.ui_build_spec
version: 1.0.0
title: Спека сборки — ui-агент
type: leaf
status: active
domain: implementation
executor: llm
capability: capability.ui@1.0.0
methodology: minimal
requires:
  state: [business_request]
  artifacts:
    required:
      - architecture.component_model@1.0.0
    optional:
      - common.feasibility_assessment@1.0.0
      - architecture.interaction_view@1.0.0
      - common.normalized_request@1.0.0
produces:
  artifact: implementation.ui_build_spec@1.0.0
context:
  include: [artifact.*]
  max_tokens: 24000
planning:
  priority: 300
summary: |
  Ты — ui-агент сборки. Из feasibility возьми части, где covered_by ==
  capability.ui, и ui-компоненты из component_model. По каждой назначенной
  части выдай спеку сборки (name / purpose / tech / interfaces / data /
  dependencies / test_approach). Заполни assigned_parts. То, что в твой
  cannot_do, — в out_of_scope. Нерешённое — в open_questions. Если ничего не
  назначено — components пустой, в summary заметка.
