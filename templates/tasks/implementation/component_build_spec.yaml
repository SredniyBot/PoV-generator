kind: task_template
id: implementation.component_build_spec
version: 1.0.0
title: Спека сборки компонента
type: leaf
status: active
domain: implementation
executor: llm
methodology: minimal
requires:
  state: [business_request]
  artifacts:
    required:
      - architecture.component_model@1.0.0
    optional:
      - common.feasibility_assessment@1.0.0
      - architecture.system_context_definition@1.0.0
