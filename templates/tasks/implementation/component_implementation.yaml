kind: task_template
id: implementation.component_implementation
version: 1.0.0
title: Реализация компонента агентом
type: leaf
status: active
domain: implementation
# Ф8: узел-агент (harness) реализует ОДИН компонент по его спеке сборки и
# отдаёт исходный код файловым бандлом. Гейты «готово» (DoD) проверяют результат
# в песочнице. На stub-рантайме — детерминированная фикстура-каталог.
executor: harness
harness_output: bundle
methodology: minimal
requires:
  state: [business_request]
  artifacts:
    required:
      # RG: каркас (общее ядро) обязан существовать до сборки компонента — это
      # data-зависимость, удерживающая порядок «каркас → компоненты».
      - implementation.project_scaffold@1.0.0
      - implementation.component_build_spec@1.0.0
      - architecture.component_model@1.0.0
    optional:
      - implementation.build_manifest@1.0.0
      - common.feasibility_assessment@1.0.0
      - common.normalized_request@1.0.0
produces:
  artifact: implementation.component_implementation@1.0.0
# Гейт готовности: минимальная проверка наличия структуры проекта. Реальные
# адаптеры (Ф7) прогонят его в песочнице; провал = узел не выполнен.
harness_gates:
  - name: smoke
    command: "test -d src || test -f README.md"
context:
  include: [artifact.*]
  max_tokens: 24000
planning:
  priority: 400
summary: |
  Реализуй ОДИН компонент системы по его спеке сборки
  (implementation.component_build_spec), встроив его в УЖЕ ГОТОВОЕ общее ядро.

  Какой именно компонент — в контексте под заголовком «Целевой элемент (фокус
  задачи)». Работай ТОЛЬКО по нему.

  Сначала прочти общее ядро в корне рабочего каталога (оно авторитетно и
  неизменно): AGENTS.md (правила), CONVENTIONS.md/STACK.md (устав и версии),
  /contracts/ (контракты соседей — строй ПРОТИВ них, а не против чужого кода),
  manifest сборки (твой сервис, его зона и стек).

  Затем положи код компонента ТОЛЬКО в зону своего сервиса
  (services/<сервис>/...). НЕ трогай чужие зоны, корневые файлы и контракты —
  это сломает соседей и сборку. Реализуй внутренние модули по порядку
  (internal_edges), с минимальным тестом на компонент. Соблюдай стек и конвенции
  ядра.

  Не выходи за рамки спеки и контрактов; чего не хватает — отметь в README
  компонента, не выдумывай интерфейсы соседей.
