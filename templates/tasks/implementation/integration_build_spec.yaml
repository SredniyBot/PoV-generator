kind: task_template
id: implementation.integration_build_spec
version: 1.0.0
title: Спека сборки — integration-агент
type: leaf
status: active
domain: implementation
executor: llm
capability: capability.integration@1.0.0
methodology: minimal
requires:
  state: [business_request]
  artifacts:
    required:
      - architecture.component_decomposition@1.0.0
    optional:
      - common.feasibility_assessment@1.0.0
      - architecture.interaction_view@1.0.0
      - common.normalized_request@1.0.0
produces:
  artifact: implementation.integration_build_spec@1.0.0
context:
  include: [artifact.*]
  max_tokens: 24000
planning:
  priority: 300
summary: |
  Ты — integration-агент сборки. Из feasibility возьми части, где covered_by
  == capability.integration, и интеграционные компоненты из component_decomposition.
  По каждой назначенной части выдай спеку сборки (name / purpose / tech /
  interfaces / data / dependencies / test_approach). Заполни assigned_parts.
  Части без предоставленного доступа к контуру (твой cannot_do) — в
  out_of_scope с пометкой «нужен доступ». Нерешённое — в open_questions. Если
  ничего не назначено — components пустой, в summary заметка.
