kind: task_template
id: implementation.backend_build_spec
version: 1.0.0
title: Спека сборки — backend-агент
type: leaf
status: active
domain: implementation
executor: agent
agent: agent.backend@1.0.0
methodology: minimal
requires:
  state: [business_request]
  artifacts:
    required:
      - architecture.component_decomposition@1.0.0
    optional:
      - common.feasibility_assessment@1.0.0
      - architecture.interaction_view@1.0.0
      - common.normalized_request@1.0.0
produces:
  artifact: implementation.backend_build_spec@1.0.0
context:
  include: [artifact.*]
  max_tokens: 24000
planning:
  priority: 300
summary: |
  Ты — backend-агент сборки. Из feasibility возьми части, где covered_by ==
  agent.backend, и backend-компоненты из component_decomposition. По каждой
  назначенной части выдай спеку сборки:
  • name — компонент/часть; • purpose — что делает; • tech — технологии из
  твоего контракта; • interfaces — ключевые эндпоинты/интерфейсы; • data —
  данные/схемы, которыми владеет; • dependencies — от чего зависит;
  • test_approach — как проверяем.
  Заполни assigned_parts. Части, упирающиеся в твой cannot_do, вынеси в
  out_of_scope с пояснением. Нерешённое — в open_questions. Если тебе ничего
  не назначено — components пустой, в summary явная заметка.
