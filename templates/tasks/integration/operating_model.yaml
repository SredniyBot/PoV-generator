summary: |
  Опиши интеграционную и операционную модель проекта на уровне, пригодном для
  согласования с ИТ-отделом и архитекторами заказчика. Конкретные системы,
  форматы, операционные роли.

  Структура (включай разделы, для которых есть содержание в бизнес-запросе):

  • СИСТЕМЫ-ИСТОЧНИКИ. Какие корпоративные системы поставляют данные или
    события. По каждой: название (как в бизнес-запросе), тип содержимого, формат
    обмена (API / выгрузка / база / файлы), владелец, известные ограничения
    доступа. Не вставляй системы, которых нет в запросе.

  • ЦЕЛЕВЫЕ ИНТЕГРАЦИИ. Что и куда подключаем: какая система-источник, какое
    целевое потребление, тип взаимодействия (pull / push, sync / async), модель
    обновления (real-time / периодически / по запросу), частота и объём.

  • API И КОНТРАКТЫ. Если проект предоставляет API наружу — опиши endpoints,
    формат, версионирование, аутентификацию, rate-limiting. Если API не в
    скоупе — раздел опускай.

  • МОДЕЛЬ ОБНОВЛЕНИЯ ДАННЫХ. Явно разделить: режим работы в PoV (часто —
    разовые выгрузки) и режим, который рассматривается для следующего этапа
    (регулярная интеграция, если применимо).

  • ТОЧКИ ПОТРЕБЛЕНИЯ РЕЗУЛЬТАТА. Куда поставляется выход проекта: внутренний
    UI, портал заказчика, экспорт, API для смежных систем, и т.п. Только то, что
    реально следует из запроса.

  • ОПЕРАЦИОННЫЕ РОЛИ. Кто эксплуатирует решение после поставки: кто запускает
    обмены, кто следит за качеством, кто разбирает инциденты. SLA, если есть в
    запросе или вытекает из природы проекта.

  • ЗАВИСИМОСТИ И РИСКИ. Что может сломаться: изменение схем на стороне
    источника без оповещения, недоступность интегрированной системы, изменение
    политик доступа. По каждому риску — митигация.

  Правила:
  • Используй имена систем и форматы, явно упомянутые в запросе. Не подменяй
    «корпоративная система-источник» на конкретный вендор, которого там нет.
  • PoV vs production разделяй явно. На PoV почти всегда разовые выгрузки;
    регулярная интеграция — обычно следующий этап.
  • Если решения пользователя зафиксировали конкретный механизм (например,
    «маскирование на стороне заказчика перед выгрузкой») — опиши это в качестве
    обязательного контракта.

  confidence 0.7-0.85.
