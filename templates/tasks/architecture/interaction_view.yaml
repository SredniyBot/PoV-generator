summary: |
  Опиши ключевые потоки взаимодействия между компонентами системы и
  внешними участниками. Это раздел про то, КАК работает система в
  динамике: какие сценарии происходят, кто кого вызывает, что передаётся.
  Опирайся на system_context_definition (внешние системы) и
  component_decomposition (внутренние компоненты).

  Структура:

  ▸ SUMMARY (опционально) — 1-3 предложения о ключевых сценариях
    взаимодействия и природе протоколов (синхронные REST / асинхронные
    события / батч-обработка).

  ▸ FLOWS — основные сценарии взаимодействия. Для каждого:
    — `name` — короткое имя сценария (например «Подача нового запроса»,
      «Ежедневное обновление справочников»)
    — `trigger` — что запускает сценарий (действие пользователя, расписание,
      внешнее событие)
    — `participants` — список участников (компоненты + внешние системы) в
      порядке появления в сценарии
    — `steps` — массив шагов. Каждый шаг — одна строка с описанием
      действия (например «API Gateway валидирует запрос и кладёт в Kafka»)

  ▸ INTERACTION_DIAGRAM — диаграмма ключевого сценария как
    **структурированный объект** (не Mermaid-строка!). Mermaid собирается
    рендерером детерминированно. Поле `kind` определяет тип:

    Вариант 1 — `kind: "sequence"` (для строгих последовательностей):
    — `participants` — список участников. Для каждого:
        • `id` — короткий ASCII-идентификатор (`U`, `Gateway`, `Worker`).
        • `label` (опционально) — человекочитаемое имя (любые символы).
    — `messages` — список сообщений. Для каждого:
        • `from`, `to` — id участников.
        • `label` — текст сообщения.
        • `kind` (опционально) — `request` (по умолчанию, `->>`),
          `reply` (`-->>`, ответ), `async_request` (`-)`, fire-and-forget),
          `async_reply` (`--)`).

    Пример sequence:

    ```json
    "interaction_diagram": {
      "kind": "sequence",
      "participants": [
        {"id": "U", "label": "User"},
        {"id": "Gateway", "label": "API Gateway"},
        {"id": "Worker", "label": "Worker"},
        {"id": "Store", "label": "Store"}
      ],
      "messages": [
        {"from": "U", "to": "Gateway", "label": "POST /request"},
        {"from": "Gateway", "to": "Worker", "label": "enqueue"},
        {"from": "Worker", "to": "Store", "label": "save"},
        {"from": "Worker", "to": "Gateway", "label": "ack", "kind": "reply"},
        {"from": "Gateway", "to": "U", "label": "202 Accepted", "kind": "reply"}
      ]
    }
    ```

    Вариант 2 — `kind: "flowchart"` (для разветвлённых процессов с
    условиями): структура та же, что у component_decomposition.component_diagram —
    `direction`, `nodes` (с опциональным `shape`, включая `rhombus` для
    условий), `edges` (с опциональным `label` и `kind` ∈ solid/dotted/thick).

  ▸ DATA_CONTRACTS (опционально) — формат данных, которыми обмениваются
    компоненты. Для каждой пары:
    — `from`, `to` — какие компоненты
    — `payload` — что передаётся (одной строкой)
    — `format` (опционально) — JSON / protobuf / CSV / event

  ▸ FAILURE_MODES (опционально) — что может пойти не так в сценарии и
    какое поведение системы ожидается (timeout / retry / circuit breaker /
    отказ с понятным сообщением). Каждый — одной строкой.

  Правила:
  • Не выдумывай флоу, которых не следует из контекста или компонентов.
  • Используй те же имена участников/узлов, что в component_decomposition
    (`id` совпадает).
  • `id` — короткий ASCII; любые подписи (в т.ч. `&`, `<`, `>` и кириллица) —
    в `label` или `messages[].label`, экранирование делается рендерером.
  • Если deployment_topology доступен — учитывай размещение компонентов
    в зонах при описании сетевых вызовов.

  CONFIDENCE и BLOCKING_QUESTIONS — динамика системы это место, где
  «допущения по умолчанию» особенно опасны: ошибка в выборе синхронности
  или политики ретраев меняет нефункциональные характеристики целиком.

  ▸ `blocking_questions` ОБЯЗАТЕЛЬНО ЗАПОЛНЯЙ, если выполнено хотя бы одно:
    — для ключевого сценария не ясен режим: синхронный ответ требуется
      пользователю или допустима асинхронная обработка с уведомлением;
    — между компонентами выбран event-based вызов, но требования к
      гарантиям доставки (at-most-once / at-least-once / exactly-once)
      не вытекают из upstream'а;
    — есть внешняя интеграция без указания политики на сбой (retry?
      circuit breaker? fallback? отказ с понятной ошибкой?);
    — `failure_modes` остались пустыми, а сценарий критичен для бизнеса
      (платёж, регистрация, отправка отчётности);
    — `data_contracts` нужны для интеграции, но формат payload не задан
      в integration_operating_model.
    Каждый вопрос — конкретный, с привязкой к сценарию. Пример: «В
    сценарии "Подача заявки": нужен ли синхронный ответ с результатом
    обработки (≤2с) или достаточно асинхронного уведомления (push /
    email / опрос)?»

  ▸ `confidence` — число 0.0-1.0, отражает уверенность в ДИНАМИКЕ:
    — 0.8-0.95 — все сценарии описаны на основе явных требований
      (нагрузка, SLA, протоколы заданы в upstream), failure_modes
      покрыты, blocking_questions уточняющий.
    — 0.6-0.8 — основные шаги ясны, но 1-3 выбора по протоколу /
      синхронности / гарантиям сделаны архитектором.
    — 0.4-0.6 — несколько сценариев работают на допущениях, failure_modes
      гипотетические.
    — <0.4 — флоу — рабочая гипотеза, реальная динамика зависит от
      ответов на blocking_questions.

  НЕ СТАВЬ confidence ≥0.8, если в interactions есть выбор по
  синхронности / гарантиям / failure handling, который не подтверждён
  upstream'ом или заказчиком.
