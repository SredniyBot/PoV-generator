kind: task_template
id: architecture.prepare_architecture_doc
version: 1.0.0
title: Подготовить архитектурный документ
type: composite
status: active
domain: architecture
children:
  - id: system_context_definition
    task: architecture.system_context_definition@1.0.0
  - id: component_model
    task: architecture.component_model@1.0.0
  - id: interaction_view
    task: architecture.interaction_view@1.0.0
  - id: deployment_map
    task: architecture.deployment_map@1.0.0
    required: false
  - id: project_risk_register
    task: common.project_risk_register@1.0.0
    required: false
  - id: design_synthesis
    task: architecture.design_synthesis@1.0.0
# Порядок генерации (по priority, design_synthesis — последний, priority 100):
# system_context → component_model → interaction_view → deployment_map →
# design_synthesis. Каждый шаг ссылается только на id, зафиксированные выше
# (корректность по построению).
#
# deployment_map помечен required: false — он не блокирует завершение цели,
# но всегда выполним (его единственный вход — component_model) и за счёт
# priority отрабатывает до сборки, обогащая документ. project_risk_register
# тоже required: false — требует артефактов ТЗ-потока; без ТЗ останется
# заблокированным, и документ соберётся без секции Risks (согласовано).
#
# component_decomposition заменён на component_model (Ф4 переработки гейта);
# шаблон component_decomposition сохранён в реестре для закреплённых графом
# прошлых проектов.
#
# slots — отложены. Доменные расширения (architecture.* domain packs)
# планируются на отдельный этап roadmap.
