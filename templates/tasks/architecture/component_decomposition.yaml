summary: |
  Декомпозируй проектируемую систему на ключевые внутренние компоненты —
  это раздел про то, КАК система устроена внутри, в дополнение к контексту
  (что она делает снаружи). Опирайся на system_context_definition: каждый
  актор и каждое внешнее взаимодействие должны быть «обслужены» каким-то
  компонентом внутри.

  Структура:

  ▸ SUMMARY (опционально) — 1-3 предложения о подходе к декомпозиции
    (по слоям, по доменам, по жизненному циклу данных) и принципиальном
    разделении ответственности.

  ▸ COMPONENTS — список внутренних компонентов. Для каждого:
    — `name` — короткое имя (например «API Gateway», «ML-сервис», «Очередь
      событий»)
    — `responsibilities` — за что отвечает (одно-два предложения)
    — `owns_data` (опционально) — какие данные хранит или владеет
    — `dependencies` (опционально) — от каких других компонентов / внешних
      систем зависит

  ▸ COMPONENT_DIAGRAM — диаграмма компонентов как **структурированный
    объект** (не Mermaid-строка!). Mermaid собирается рендерером
    детерминированно. Поля:

    — `direction` — `LR` (по умолчанию) или `TD` / `RL` / `TB` / `BT`.
    — `nodes` — список узлов (внутренние компоненты + внешние системы из
      контекста). Для каждого:
        • `id` — короткий ASCII-идентификатор (`Gateway`, `Worker`, `Store`).
          Только буквы/цифры/`_`, не должно начинаться с цифры.
        • `label` — человекочитаемая подпись (любые символы, в т.ч. кириллица,
          `&`, `<`, `>` — рендерер сам экранирует).
        • `shape` (опционально) — `rect` (по умолчанию), `round`, `stadium`,
          `subroutine`, `cylinder` (для БД/хранилищ), `circle`, `hexagon`,
          `rhombus` (для решений).
    — `edges` — список рёбер. Для каждого:
        • `from`, `to` — id узлов.
        • `label` (опционально) — подпись на стрелке.
        • `kind` (опционально) — `solid` (по умолчанию), `dotted`, `thick`.

    Пример:

    ```json
    "component_diagram": {
      "direction": "LR",
      "nodes": [
        {"id": "Gateway", "label": "API Gateway"},
        {"id": "Worker", "label": "Воркер обработки"},
        {"id": "Store", "label": "Хранилище", "shape": "cylinder"}
      ],
      "edges": [
        {"from": "Gateway", "to": "Worker"},
        {"from": "Worker", "to": "Store"}
      ]
    }
    ```

  ▸ CROSS_CUTTING_CONCERNS (опционально) — сквозные аспекты, которые
    касаются нескольких компонентов (логирование, авторизация, мониторинг,
    конфигурация, миграции). Каждый — одной строкой.

  ▸ OPEN_DESIGN_QUESTIONS (опционально) — вопросы по дизайну, которые
    нужно решить до реализации. Не путать с blocking_questions: эти —
    вопросы внутри архитектурной команды, blocking_questions — наружу.

  Правила:
  • Не выдумывай компоненты без оснований из контекста — лучше меньше
    и осмысленнее.
  • `id` — обязательно короткий ASCII. Длинные/спецсимвольные подписи (в т.ч.
    с `&`, `<`, `>`) идут в `label`.
  • Если в контексте есть `ml.predictive_problem_definition` или
    `frontend.ui_requirements_outline` — учитывай специфику этих доменов
    в выделении компонентов.

  CONFIDENCE и BLOCKING_QUESTIONS — это сигнал, где архитектор сделал
  выбор «по умолчанию» и где этот выбор стоит подтвердить с заказчиком.
  Декомпозиция всегда содержит варианты — её нельзя считать описанием.

  ▸ `blocking_questions` ОБЯЗАТЕЛЬНО ЗАПОЛНЯЙ, если выполнено хотя бы одно:
    — выбор между монолитом и сервисами не очевиден из требований
      (нагрузка, команда, deployment-ограничения не описаны);
    — есть компонент с неочевидной ответственностью (например, «слой
      бизнес-логики» без указания, что именно он делает);
    — упомянуто хранилище без типа (SQL? NoSQL? key-value? event log?);
    — компонент имеет внешнюю интеграцию, но протокол / формат не
      определён в upstream'е;
    — `cross_cutting_concerns` затрагивают несколько компонентов, но
      выбор подхода (например, sidecar vs library vs централизованный
      сервис для логирования) не сделан.
    Каждый вопрос — конкретный, с альтернативами. Пример: «Выбрать
    стратегию хранения профилей пользователей: PostgreSQL (если важна
    транзакционность) или MongoDB (если важны произвольные атрибуты)».

  ▸ `confidence` — число 0.0-1.0, отражает уверенность в ДЕКОМПОЗИЦИИ:
    — 0.8-0.95 — компоненты однозначно вытекают из контекста и доменных
      артефактов, ответственности не перекрываются, blocking_questions
      пуст или уточняющий.
    — 0.6-0.8 — основные компоненты понятны, но 1-3 значимых выбора
      сделаны архитектором (например, «выделить отдельный auth-сервис»)
      без подтверждения от заказчика.
    — 0.4-0.6 — есть несколько крупных открытых выборов (тип хранилища,
      граница монолита, синхронность). Структура — рабочая гипотеза.
    — <0.4 — декомпозиция почти спекулятивна; компоненты названы для
      того, чтобы документ был не пустым, реальная структура зависит
      от ответов на blocking_questions.

  НЕ СТАВЬ confidence ≥0.8, если в decomposition есть выбор, который
  поменяет структуру при другом ответе заказчика (это и есть «вариант»,
  а не «описание»).
