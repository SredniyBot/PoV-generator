summary: |
  Декомпозируй проектируемую систему на ключевые внутренние компоненты —
  это раздел про то, КАК система устроена внутри, в дополнение к контексту
  (что она делает снаружи). Опирайся на system_context_definition: каждый
  актор и каждое внешнее взаимодействие должны быть «обслужены» каким-то
  компонентом внутри.

  Структура:

  ▸ SUMMARY (опционально) — 1-3 предложения о подходе к декомпозиции
    (по слоям, по доменам, по жизненному циклу данных) и принципиальном
    разделении ответственности.

  ▸ COMPONENTS — список внутренних компонентов. Для каждого:
    — `name` — короткое имя (например «API Gateway», «ML-сервис», «Очередь
      событий»)
    — `responsibilities` — за что отвечает (одно-два предложения)
    — `owns_data` (опционально) — какие данные хранит или владеет
    — `dependencies` (опционально) — от каких других компонентов / внешних
      систем зависит

  ▸ MERMAID_COMPONENT_DIAGRAM — диаграмма компонентов в синтаксисе Mermaid
    (`flowchart TD` или `flowchart LR`). Узлы — компоненты + внешние
    системы из контекста. Стрелки — направление вызова или потока данных
    с короткой подписью. Пример:

    ```
    flowchart LR
        Gateway[API Gateway]
        Worker[Воркер обработки]
        Store[(Хранилище)]
        Gateway --> Worker
        Worker --> Store
    ```

    КАК УПАКОВАТЬ ДИАГРАММУ В JSON: каждое объявление и каждое ребро —
    отдельная строка, разделённая `\n`. В JSON-значении это выглядит как:

    `"mermaid_component_diagram": "flowchart LR\nGateway[API Gateway]\nWorker[Воркер обработки]\nStore[(Хранилище)]\nGateway --> Worker\nWorker --> Store"`

    Без `\n` диаграмма не отрендерится — рендерер ничего не угадывает.

  ▸ CROSS_CUTTING_CONCERNS (опционально) — сквозные аспекты, которые
    касаются нескольких компонентов (логирование, авторизация, мониторинг,
    конфигурация, миграции). Каждый — одной строкой.

  ▸ OPEN_DESIGN_QUESTIONS (опционально) — вопросы по дизайну, которые
    нужно решить до реализации. Не путать с blocking_questions: эти —
    вопросы внутри архитектурной команды, blocking_questions — наружу.

  Правила:
  • Не выдумывай компоненты без оснований из контекста — лучше меньше
    и осмысленнее.
  • Узлы Mermaid именуй короткими ASCII-id, длинные русские подписи в `[...]`.
  • Если подпись содержит `&`, `<`, `>` или другие спецсимволы — оборачивай
    её в двойные кавычки: `ASR["ASR & Diarization Module"]`. Без кавычек
    mermaid.js v11 падает на парсинге.
  • Если в контексте есть `ml.predictive_problem_definition` или
    `frontend.ui_requirements_outline` — учитывай специфику этих доменов
    в выделении компонентов.

  confidence 0.65-0.85.
