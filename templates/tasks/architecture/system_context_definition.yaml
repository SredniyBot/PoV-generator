summary: |
  Опиши системный контекст проектируемого решения — внешнюю границу системы
  и её взаимодействия с окружающим миром. Этот артефакт отвечает на вопрос
  «что система делает и с кем», но не «как она устроена внутри» — внутреннее
  устройство пойдёт в следующей задаче (component_decomposition).

  Структура:

  ▸ SYSTEM_NAME — короткое имя системы (как её называют в бизнесе или в брифе).

  ▸ SYSTEM_PURPOSE — одно-два предложения о том, зачем система существует
    и какую бизнес-функцию выполняет. Опирайся на normalized_request и
    business_outcome_model (если доступны).

  ▸ ACTORS — кто инициирует взаимодействие с системой. Для каждого:
    — `name` — кто это (человек, роль, другая система)
    — `kind` — категория (`user`, `system`, `regulator`, `data_source`, `operator`)
    — `description` (опционально) — что именно делает с системой

  ▸ EXTERNAL_SYSTEMS — внешние системы, с которыми проектируемая система
    обменивается данными или вызовами. Для каждой:
    — `name` — название системы / сервиса
    — `role` — её роль во взаимодействии (источник данных, поставщик
      авторизации, получатель событий, …)
    — `interactions` (опционально) — список конкретных взаимодействий
      (например: «получает реестр клиентов по REST API», «отправляет события
      по Kafka»)

  ▸ SYSTEM_BOUNDARIES (опционально) — что система ДЕЛАЕТ и НЕ делает.
    Полезно когда границы неочевидны (например — «система не хранит ПДн,
    только их хеши»).

  ▸ ASSUMPTIONS (опционально) — допущения, на которых построен контекст.

  ▸ CONTEXT_DIAGRAM — диаграмма системного контекста как **структурированный
    объект** (не Mermaid-строка!). Mermaid собирается из этого объекта на
    стороне рендерера детерминированно. Поля:

    — `direction` — `LR` (по умолчанию) или `TD` / `RL` / `TB` / `BT`.
    — `nodes` — список узлов. Для каждого:
        • `id` — короткий ASCII-идентификатор (например `Manager`, `System`,
          `CRM`). Только буквы/цифры/`_`, не должно начинаться с цифры.
          Используется как имя узла в Mermaid.
        • `label` — человекочитаемая подпись (любые символы, в т.ч. кириллица,
          `&`, `<`, `>` — рендерер сам экранирует).
        • `shape` (опционально) — одно из: `rect` (по умолчанию), `round`,
          `stadium`, `subroutine`, `cylinder` (для БД), `circle`, `hexagon`,
          `rhombus` (для условий).
    — `edges` — список рёбер. Для каждого:
        • `from`, `to` — id узлов.
        • `label` (опционально) — подпись на стрелке.
        • `kind` (опционально) — `solid` (по умолчанию), `dotted`, `thick`.

    Пример (структура, не значения):

    ```json
    "context_diagram": {
      "direction": "LR",
      "nodes": [
        {"id": "Manager", "label": "Бизнес-менеджер"},
        {"id": "System", "label": "Проектируемая система"},
        {"id": "CRM", "label": "CRM", "shape": "cylinder"}
      ],
      "edges": [
        {"from": "Manager", "to": "System", "label": "подаёт запрос"},
        {"from": "System", "to": "CRM", "label": "читает клиентов"}
      ]
    }
    ```

  Правила:
  • Не выдумывай внешние системы, которых нет в normalized_request или
    integration_operating_model. Если их недостаточно — короткая честная
    диаграмма с явными допущениями (`assumptions`), чем сложный фантом.
  • `id` — обязательно короткий ASCII. Длинная подпись (в т.ч. с
    кириллицей, `&`, `<`, `>`) идёт в `label` — экранирование делается
    автоматически.
  • Если в брифе ничего не сказано про конкретных акторов — выдели
    минимум два архетипических («Инициатор запроса», «Получатель
    результата») и пометь в `assumptions`.

  CONFIDENCE — это сигнал заказчику, что архитектор чего-то не знает.
  Выставляй её честно; додумывание молча — хуже, чем явное допущение.
  Все неизвестные по существу — не названы конкретные внешние системы,
  неясен инициатор ключевого сценария, размыты границы системы, упомянута
  регуляторика (ФЗ-152, GDPR) без конкретики применимости — фиксируй в
  `assumptions` и снижай `confidence`, а не «договаривай за заказчика».

  ▸ `confidence` — число 0.0-1.0, отражает уверенность в КОНТЕКСТЕ:
    — 0.85-0.95 — все акторы и внешние системы названы конкретно,
      границы ясны, существенных открытых допущений нет.
    — 0.65-0.85 — есть архетипические акторы или родовые названия
      внешних систем, базовая структура понятна, 1-3 открытых допущения.
    — 0.4-0.65 — несколько ключевых внешних систем не названы, есть
      сомнения по границам, много допущений.
    — <0.4 — контекст почти невозможно зафиксировать без ответов;
      в этом случае диаграмма минимальна, акторы — архетипические.

  НЕ СТАВЬ confidence ≥0.85, если есть хотя бы одно существенное допущение
  — это сигнал того, что архитектор «договорил за заказчика».
