kind: task_template
id: architecture.component_model
version: 1.0.0
title: Собрать модель компонентов
type: leaf
status: active
# Спина архитектуры: компоненты + контракты + внутренний состав + покрытие в
# одной генерации. Класс complex — качество критично, всё взаимозависимое видно
# модели в одном ответе (корректность по построению).
complexity: complex
domain: architecture
executor: llm
methodology: minimal
requires:
  state: [business_request]
  artifacts:
    # Модель компонентов выводится из утверждённого ТЗ и системного контекста.
    # Критерии приёмки/НФТ (acceptance), выбранный подход (trade-off) и
    # ограничения — прямые драйверы декомпозиции, поэтому подаются явно.
    required:
      - architecture.system_context_definition@1.0.0
      - common.requirements_spec@1.0.0
    optional:
      - common.acceptance_model_definition@1.0.0
      - common.nonfunctional_requirements@1.0.0
      - common.solution_tradeoff_matrix@1.0.0
      - common.constraint_inventory@1.0.0
      - common.feasibility_assessment@1.0.0
      - common.normalized_request@1.0.0
      - common.business_outcome_model@1.0.0
      - common.scope_boundary_matrix@1.0.0
      - common.stakeholder_map@1.0.0
      - ml.predictive_problem_definition@1.0.0
      - frontend.ui_requirements_outline@1.0.0
      - integration.integration_operating_model@1.0.0
produces:
  artifact: architecture.component_model@1.0.0
context:
  max_tokens: 24000
planning:
  priority: 470
effects:
  readiness:
    set:
      - dimension: components_modeled
        status: ready
summary: |
  Собери модель компонентов проектируемой системы — структурированный каталог
  с контрактами, а не описание прозой. Опирайся на system_context_definition:
  каждый актор и каждая внешняя система должны быть закрыты каким-то компонентом.

  ГЛАВНОЕ ПРАВИЛО ГРАНУЛЯРНОСТИ: компонентов — минимум. Компонент — это
  логическая buildable-единица с одной ответственностью, а НЕ функция. По
  умолчанию мало крупных компонентов с чистыми границами; каждый дополнительный
  компонент обязан быть обоснован драйвером (нефункциональное требование или
  граница чистой архитектуры) в поле `justification`. Дробление «по функции» —
  ошибка.

  По каждому компоненту:

  • `id` — короткий стабильный ASCII (буквы/цифры/_, не с цифры). На него
    ссылаются другие компоненты и покрытие.
  • `name`, `type` (service | datastore | queue | ui | scheduled | external),
    `layer` (core | application | adapter | infrastructure).
  • `responsibility` — ОДНА ответственность одним предложением.
  • `justification` — почему это отдельный компонент (драйвер).
  • `capability_owner` (опц.) — какое умение его строит.
  • `nfr` (опц.) — нефункциональные требования именно к этому компоненту.
  • `provided_interfaces` — контракт «что предоставляю»: `name`, `sync`
    (sync/async), `criticality` (normal/critical), `input`, `output`, `errors`.
    Для critical-швов (деньги, внешняя граница, целостность данных,
    регуляторика) добавь `detail` — схему/инварианты/идемпотентность/гарантии.
  • `consumed_interfaces` — «что потребляю»: `component` (id ДРУГОГО компонента —
    ссылайся ТОЛЬКО на объявленные id) + `interface` (имя его предоставляемого
    интерфейса). Это и есть направленные зависимости.
  • `owned_data` (опц.), `events` (опц., emits/consumes).
  • `modules` — ОБЯЗАТЕЛЬНЫЙ верхнеуровневый внутренний состав: для каждого
    `id` (в пространстве имён компонента), `responsibility`, и `realizes` —
    какой предоставляемый интерфейс реализует. Каждый предоставляемый интерфейс
    должен быть закреплён за каким-то модулем.
  • `internal_edges` (опц.) — зависимости между модулями ВНУТРИ компонента
    (`from`/`to` — id модулей).
  • `requisites` (опц.) — КОНКРЕТНЫЕ данные/доступы от ПОЛЬЗОВАТЕЛЯ, чтобы
    построить компонент. Каждый — самодостаточный запрос, а НЕ общая тема:
    `id`; `kind` (credential | dataset | file | setting | interface_format |
    sample | other); `title` — что именно нужно, конкретно (не «описание потоков»,
    а «список из 3-5 ключевых сценариев со шагами»); `needed_for` — какой
    интерфейс/функция без этого не строится; `why` — зачем это нужно, одной
    фразой; `example` — пример или формат запрашиваемого (столбцы CSV, образец
    значения, имя системы для доступа); `blocking` (true — без этого компонент не
    построить). НЕ добавляй реквизит, если не можешь привести конкретный
    `example` того, что просишь, — расплывчатую тему опусти. Секреты сюда НЕ пиши
    (значение придёт отдельно и безопасно) — только ЧТО нужно.

  `coverage` — карта покрытия (полнота как обязательное заполнение):
  • `actors` — на каждого актора из контекста: какие компоненты его обслуживают;
  • `external_systems` — на каждую внешнюю систему: какие компоненты её
    интегрируют. Ссылайся только на объявленные id компонентов.

  `diagrams` (опц., но желательно где помогает понять) — список диаграмм
  (type: components — связи; internal с `of: <id компонента>` — устройство;
  data — поток данных). Каждая: `type`, `caption`, `spec` (структурный объект
  с `kind: flowchart` + nodes/edges или `kind: sequence` + participants/messages).
  Ставь диаграмму там, где связи проще увидеть, чем прочитать.

  Правила:
  • Не выдумывай компоненты и внешние системы, которых нет в контексте.
  • Ссылки (consumed_interfaces.component, coverage.*) — ТОЛЬКО на объявленные id.
  • Правило зависимостей: зависеть можно только «внутрь» (core не зависит от
    adapter/infrastructure).

  CONFIDENCE — сигнал, где архитектор сделал выбор «по умолчанию» и где его стоит
  подтвердить. Неочевидные выборы (граница компонента, тип хранилища, протокол,
  синхронность) — снижай confidence, а не молча «по умолчанию».

  ▸ `confidence` — число 0.0-1.0:
    — 0.8-0.95 — компоненты однозначно вытекают из контекста, контракты полны,
      открытых выборов нет.
    — 0.6-0.8 — основное понятно, 1-3 значимых выбора сделаны без подтверждения.
    — 0.4-0.6 — несколько крупных открытых выборов; структура — гипотеза.
    — <0.4 — модель почти спекулятивна.
