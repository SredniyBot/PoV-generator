summary: |
  Опиши требования информационной безопасности и комплаенса проекта на уровне,
  пригодном для согласования с CISO или DPO заказчика.

  Структура (включай разделы, для которых есть содержание):

  • КОНТУР РАЗМЕЩЕНИЯ. Где живёт решение: on-prem ЦОД заказчика, защищённое
    облако определённого уровня, гибрид. Что НЕЛЬЗЯ (например, обработка
    персональных данных в публичном неаттестованном облаке — если это следует
    из запроса). Требования к сетевому окружению.

  • ОГРАНИЧЕНИЯ ПО ПРИВАТНОСТИ ДАННЫХ. Какие категории персональных данных
    затрагиваются (по факту запроса). Режим обработки (обезличивание,
    псевдонимизация, шифрование при передаче и хранении). Где это делается — на
    стороне заказчика перед передачей или на стороне подрядчика. Применимая
    регуляторика юрисдикции, в которой работает проект — ссылайся на акты, явно
    упомянутые в бизнес-запросе или очевидно применимые по контексту; не
    выдумывай ссылки на нормативку, которой в запросе нет.

  • КОНТРОЛЬ ДОСТУПА. Модель аутентификации (как в решениях пользователя — 2FA,
    SSO, mTLS, и т.п.) и авторизации (RBAC с конкретными ролями из stakeholder_map).
    Правило минимально достаточного доступа. Аудит-логирование.

  • ДОПУСТИМОЕ ИСПОЛЬЗОВАНИЕ ИИ. Если в проекте есть LLM-компоненты:
    — допустимы ли внешние LLM-сервисы (зависит от решений пользователя и
      политики ИБ заказчика);
    — обязательное обезличивание перед отправкой во внешний LLM, если используется;
    — локальные LLM как опция, если внешние запрещены;
    — логирование вызовов;
    — этические ограничения (запрет автоматических решений на основе защищённых
      признаков, если регуляторика этого требует).
    Если LLM в проекте нет — раздел опускай.

  • ОБЯЗАТЕЛЬНЫЕ МЕРЫ КОНТРОЛЯ. Шифрование на транспорте и в покое, аудит
    доступа, резервное копирование, RPO/RTO, управление секретами. Уровень
    конкретности — насколько позволяет запрос.

  • РИСКИ КОМПЛАЕНСА. Утечка данных, несогласованное использование LLM,
    недостаточный аудит, отсутствие NDA. По каждому — митигация.

  • ТРЕБОВАНИЯ К ПЕРЕДАЧЕ ПРОЕКТА. Документация (DPIA / ROPA — если применимо к
    юрисдикции), pen-testing, code review со стороны ИБ заказчика.

  Правила:
  • Регуляторные ссылки — только применимые к юрисдикции проекта и упомянутые в
    запросе или очевидно применимые. Не вставляй «152-ФЗ» или «GDPR» по
    инерции; пиши то, что соответствует контексту.
  • Опирайся на решения пользователя про маскирование, разрешённые LLM, контур
    размещения.
  • Не выдумывай конкретные сертификации (ISO 27001, SOC 2) если о них в запросе
    речи не было; либо отметь «по согласованию с заказчиком».
  • Не подменяй ИБ-требованиями требования других областей — это раздел про
    безопасность и комплаенс, не про функциональность.

  confidence 0.7-0.85.
