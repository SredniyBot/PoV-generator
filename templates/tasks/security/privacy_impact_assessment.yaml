summary: |
  Проведи оценку воздействия на персональные данные (Data Protection Impact
  Assessment, DPIA), если в проекте обрабатываются ПДн или другие
  чувствительные данные. Это отдельный, формальный раздел: DPO заказчика
  или ответственный за ИБ читает его и подписывает.

  Структура:

  ▸ КАТЕГОРИИ ПДн (pii_categories) — какие данные о субъектах обрабатываются:
    идентификационные (ФИО, контакты), биографические (возраст, семейное
    положение), профессиональные (должность, оценка эффективности),
    специальные категории (здоровье, политические взгляды) — если применимо.
    Если категория в брифе не упомянута — НЕ ВКЛЮЧАЙ.

  ▸ ЦЕЛИ ОБРАБОТКИ (processing_purposes) — для чего именно используется
    каждая категория. «ФИО используется для идентификации сотрудника
    в дашборде; обезличенный хеш используется для построения признаков
    модели».

  ▸ ПРАВОВОЕ ОСНОВАНИЕ (lawful_basis) — согласие субъекта / трудовой
    договор / законный интерес работодателя / иное. Применимо к
    юрисдикции, в которой работает проект (определи по контексту).

  ▸ МИНИМИЗАЦИЯ ДАННЫХ (data_minimization) — какие данные сознательно
    НЕ собираются, или собираются, но обезличиваются ДО передачи в
    рабочую систему. Например, «телефоны не передаются в LLM», «ФИО
    хешируется на стороне заказчика перед выгрузкой».

  ▸ МЕРЫ КОНТРОЛЯ (controls) — конкретные технические и организационные
    меры: шифрование, маскирование, RBAC, аудит-логирование, договорные
    ограничения подрядчика.

  ▸ ПРАВА СУБЪЕКТОВ ПДн (data_subject_rights) — как обеспечивается право
    на удаление, доступ, исправление. Для PoV обычно «решение работает
    с уже обезличенными данными → права субъектов не нарушаются» —
    зафиксируй именно так.

  ▸ ТРАНСГРАНИЧНАЯ ПЕРЕДАЧА (cross_border_transfers) — выходят ли данные
    за пределы юрисдикции заказчика. Если используются внешние LLM —
    укажи, обезличиваются ли данные ДО передачи.

  ▸ ХРАНЕНИЕ И РЕТЕНЦИЯ (retention_policy) — сколько хранятся данные
    PoV-датасета у подрядчика; как уничтожаются после PoV.

  ▸ ОСТАТОЧНЫЕ РИСКИ (residual_risks) — что НЕ закрыто полностью даже
    с применёнными мерами; каков план действий при инциденте.

  Правила:
  • Используй термины, применимые к юрисдикции проекта (152-ФЗ / GDPR /
    отраслевая регуляторика) — только те, что подкреплены контекстом.
  • Не пиши общими формулировками типа «обеспечивается защита данных» —
    нужна конкретная мера.
  • Если PoV работает только с синтетическими или обезличенными данными
    без ПДн — оставь pii_categories пустым и явно отметь.

  confidence 0.75-0.9 при наличии полного контекста.
