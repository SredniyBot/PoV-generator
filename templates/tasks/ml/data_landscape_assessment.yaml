summary: |
  Оцени data landscape проекта — какое сырьё для ML/аналитики реально доступно,
  в каком оно состоянии, какова реализуемость задачи. Раздел ТЗ, на который
  смотрит data-инженер перед началом работ.

  Структура:

  • ИСТОЧНИКИ ДАННЫХ. Какие системы поставляют данные. По каждой: название (как
    в бизнес-запросе или решениях), содержание (какие сущности и записи), объём,
    глубина истории, способ доступа (API / выгрузка / прямой query), известное
    состояние качества.

  • ПРИЗНАКИ. Какие группы признаков можно построить из доступных источников:
    мастер-данные (демография, атрибуты объектов), транзакционные, поведенческие,
    временные, текстовые. Конкретный состав диктуется природой задачи и
    доступными источниками; не вытягивай категории, для которых нет источника.

  • ГОТОВНОСТЬ ДАННЫХ. Есть ли labeled data для обучения, нужно ли строить
    разметку, достаточно ли глубины истории для учёта сезонности, насколько
    свежие данные (lag).

  • КАЧЕСТВО ДАННЫХ. Известные проблемы: пропуски, несогласованность между
    источниками, отсутствие части записей, зашумлённость. Используй информацию
    из бизнес-запроса, если она там есть.

  • ОГРАНИЧЕНИЯ ДОСТУПА И ПРИВАТНОСТИ. Обезличивание перед передачей, разделение
    выборок (часть может оставаться у заказчика), запрет хранить определённые
    данные у подрядчика, согласование каждой выгрузки.

  • РИСКИ ДАННЫХ. Low quality → low model quality, недостаточная глубина → не
    учим сезонность, отсутствие labeled negatives, class imbalance (если событие
    редкое), drift между обучающими и продакшен-периодами.

  • ОЦЕНКА РЕАЛИЗУЕМОСТИ. Feasibility — high / medium / low / unclear — с
    обоснованием. Рекомендованные стартовые действия (пилотная выгрузка, EDA,
    согласование полей).

  Правила:
  • Имена источников, глубина истории, известные проблемы — из бизнес-запроса
    дословно где возможно.
  • Не подставляй чужие источники (1С, корпоративный портал, конкретные системы)
    «по аналогии» — пиши только те, которые упомянуты в этом запросе.
  • Не путай «у нас есть данные» (факт) и «данные пригодны для задачи»
    (суждение) — это две разные оценки, и обе важны.
  • Если ML в проекте может оказаться не в скоупе — отметь это явно, не
    натягивай ML-задачу там, где запрос про другое.

  confidence 0.7-0.85.
