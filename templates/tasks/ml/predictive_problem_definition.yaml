kind: task_template
id: ml.predictive_problem_definition
version: 1.0.0
title: Определить предиктивную задачу
type: leaf
status: active
domain: ml
executor: llm
methodology: minimal
requires:
  state: [business_request]
  artifacts:
    # data_landscape_assessment добавлен в required: postановка предиктивной
    # задачи должна знать, какие данные доступны, прежде чем формулировать
    # горизонт, метрики и пороги. Раньше зависимость висела только в prompt
    # «опирайся если есть» — это размытое требование.
    required:
      - common.normalized_request@1.0.0
      - ml.data_landscape_assessment@1.0.0
produces:
  artifact: ml.predictive_problem_definition@1.0.0
context:
  max_tokens: 24000
planning:
  # Priority понижен с 740 до 720: должен идти ПОСЛЕ data_landscape (730).
  # Раньше priority inversion: predictive шёл первым, но логически опирается на
  # вывод feasibility данных.
  priority: 720
effects:
  readiness:
    set:
      - dimension: predictive_problem_defined
        status: ready
summary: |
  Сформулируй предиктивную задачу проекта как профессиональный data-scientist
  после первой встречи с заказчиком. Формальная постановка, по которой команда
  начинает EDA и моделирование.

  Структура:

  • ЦЕЛЕВОЕ СОБЫТИЕ. Что именно предсказываем. Включай:
    — определение события (что считается «случилось» / «не случилось»);
    — единица прогноза (что является объектом — клиент, заказ, сотрудник,
      транзакция, временное окно — в зависимости от природы задачи);
    — формальный тип задачи (binary / multiclass classification, regression,
      survival, ranking, time-series forecasting);
    — формальная метка (откуда берётся ground truth, как размечается).

  • ГОРИЗОНТ ПРОГНОЗА. На какое окно вперёд смотрим. Обоснуй с точки зрения
    бизнес-логики — есть ли в этом окне возможность для intervention.

  • ВЫХОДЫ МОДЕЛИ. Что отдаёт сервис: вероятность / категория риска / непрерывная
    оценка / ранжированный список + сопровождающие поля (calibration, объяснимость,
    confidence). Состав выходов диктуется потребителем результата.

  • МЕТРИКИ КАЧЕСТВА. Разделить:
    — основные ML-метрики, релевантные типу задачи (для бинарной классификации
      это могут быть ROC-AUC, Precision/Recall, F1; для регрессии — MAE, MAPE,
      RMSE; для ranking — NDCG, MAP@k; конкретный набор выбирай по типу);
    — бизнес-связанные метрики (precision@k для топ-объектов, recall в выбранном
      сегменте, экономия по сравнению с baseline);
    — целевые пороги — фиксируются на этапе подготовки совместно с заказчиком, в
      ТЗ указывают «согласуются», не подставляй конкретное число без обоснования.

  • ТРЕБОВАНИЯ К ОБЪЯСНИМОСТИ. Нужна ли локальная интерпретация (по каждому
    объекту), глобальная (тренды), регуляторная (право на объяснение
    автоматического решения). Зависит от категории риска и применимой
    регуляторики.

  • МОДЕЛИ-КАНДИДАТЫ. Семейства моделей, разумные для типа задачи и объёма
    данных. Обоснуй выбор; не перечисляй ради формальности.

  • FEATURE ENGINEERING. Категории признаков, которые планируем строить:
    из мастер-данных, транзакционных, поведенческих, временных, текстовых.
    Конкретные группы — только те, которые подкрепляются доступными источниками.

  • ПРОЦЕДУРА ВАЛИДАЦИИ. Train/test/validation split, кросс-валидация,
    учёт временной структуры (если данные временные), независимый hold-out
    на стороне заказчика, если применимо.

  • РИСКИ ML-ЗАДАЧИ. Class imbalance, label leak, drift, этические и
    регуляторные ограничения по защищённым признакам.

  Правила:
  • Тип задачи определяется содержанием бизнес-запроса. Не натягивай binary
    classification на проект, где речь о прогнозе непрерывной величины.
  • Метрики и пороги — без выдуманных конкретных чисел. Если в запросе порога
    нет, фиксируй «согласуется на этапе подготовки».
  • Опирайся на data_landscape_assessment, если он есть в контексте.
  • Не вставляй признаки или модели, специфичные для чужого домена.

  confidence 0.75-0.9.
