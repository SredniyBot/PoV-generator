summary: |
  Опиши требования к интерфейсу проекта как продуктовый раздел ТЗ. Конкретные роли,
  сценарии, экраны и представления — то, что фронтенд-команда возьмёт и начнёт
  прототипировать.

  Структура:

  • ПОЛЬЗОВАТЕЛЬСКИЕ РОЛИ. Кто работает с интерфейсом. По каждой роли:
    — название роли (как в бизнес-запросе или stakeholder_map);
    — ключевые задачи в системе;
    — ожидаемая глубина анализа / уровень технической подготовки;
    — устройство (десктоп / планшет / мобильный) — если из бизнес-запроса это
      следует.

  • ПОЛЬЗОВАТЕЛЬСКИЕ СЦЕНАРИИ. Последовательность шагов для типовой задачи.
    По каждому сценарию: конкретная роль + цель + 4-8 шагов.

  • КЛЮЧЕВЫЕ ЭКРАНЫ. Список основных представлений. По каждому:
    — название и назначение;
    — основные блоки;
    — действия пользователя на экране;
    — куда ведёт навигация.

  • ФИЛЬТРЫ И НАВИГАЦИЯ. Какие срезы данных или объектов нужны (зависит от
    природы проекта: по регионам, по статусам, по приоритету, по времени, и т.п.).

  • АНАЛИТИЧЕСКИЕ ПРЕДСТАВЛЕНИЯ. Если в проекте есть BI-составляющая —
    конкретные визуализации (динамика, сегментация, рейтинг, факторный анализ).
    Если BI не в скоупе — раздел опускай.

  • СЦЕНАРИИ ПОДДЕРЖКИ РЕШЕНИЙ. Где интерфейс помогает пользователю выбрать
    действие (рекомендации, объяснения, подсветка приоритетов).

  • UX-ОГРАНИЧЕНИЯ. Стиль, доступность, объяснимость, скорость отклика для
    основных операций, локализация.

  Правила:
  • Базируйся на нормализованном запросе: какие роли, какие задачи, какие
    устройства уже зафиксированы.
  • Не выдумывай экраны и фильтры, которые не подтверждены целями проекта или
    ролями. Не вставляй UI-паттерны из чужих кейсов (списки сотрудников, карты
    рисков, и т.п.), если в данном проекте про них речи нет.
  • Если устройство пользователя влияет на дизайн (мобильное основное /
    десктоп-первый) — отметь явно.

  confidence 0.7-0.85.
