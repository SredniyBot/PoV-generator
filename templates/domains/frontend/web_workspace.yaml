kind: domain_pack
id: frontend.web_workspace
version: 1.0.0
title: Веб-интерфейс и пользовательские сценарии
description: Добавляет анализ пользователей, экранов, потоков и UX-ограничений.
domain: frontend
status: active
detect:
  signals:
    - веб-интерфейс
    - интерфейс
    - ui
    - ux
    - dashboard
    - bi
    - визуализация
contributes:
  - to: spec.domain_sections
    add:
      - id: frontend_user_flow_analysis
        task: frontend.user_flow_analysis@1.0.0
  # Гейт «Архитектура»: профессиональный UI/UX дизайн (палитра/типографика/
  # экраны/формы/компоненты + подход к взаимодействию с API). Только для
  # UI-проектов (пакет активен) — органично входит в архитектурный документ.
  - to: architecture.domain_views
    add:
      - id: frontend_ui_design
        task: frontend.ui_design@1.0.0
