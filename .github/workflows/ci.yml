name: ci

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests + registry validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package + dev deps (constrained by lockfile)
        # requirements.lock pins transitive versions known to be compatible
        # (regenerate via `uv pip compile pyproject.toml --extra dev -o requirements.lock`).
        run: pip install -e .[dev] --constraint requirements.lock
      - name: ruff lint
        run: ruff check src tests
      - name: pytest
        run: pytest -q
      - name: registry validate
        run: povgen registry validate

  ui:
    name: UI build (tsc + vite)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/workspace/package-lock.json
      - name: npm ci
        working-directory: ui/workspace
        run: npm ci
      - name: build (tsc + vite)
        working-directory: ui/workspace
        run: npm run build
