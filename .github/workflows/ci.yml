name: ci

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (${{ matrix.os }} / py${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install package + dev deps (constrained by lockfile)
        # requirements.lock pins transitive versions known to be compatible
        # (regenerate via `uv pip compile pyproject.toml --extra dev -o requirements.lock`).
        run: python -m pip install -e .[dev] --constraint requirements.lock
      - name: ruff lint
        run: python -m ruff check src tests
      - name: pytest
        run: python -m pytest -q
      - name: registry validate
        run: python -m pov_generator registry validate

  ui:
    name: UI build (tsc + vite)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/workspace/package-lock.json
      - name: npm ci
        working-directory: ui/workspace
        run: npm ci
      - name: build (tsc + vite)
        working-directory: ui/workspace
        run: npm run build
