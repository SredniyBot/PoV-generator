[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pov-generator"
version = "0.1.0"
description = "Template-centric PoV planning foundation (M0-M4)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0.2,<7.0",
  "fastapi>=0.115.0,<1.0",
  # Pin starlette below 0.42: claude-agent-sdk → mcp transitively pulls
  # starlette 1.0.0, which breaks fastapi 0.115 (Router.__init__ kwargs).
  "starlette>=0.40,<0.42",
  "uvicorn>=0.35.0,<1.0",
  "websockets>=13.1,<16.0",
  "anthropic>=0.39.0,<1.0",
  "claude-agent-sdk>=0.0.20,<1.0",
  # PDF export: markdown → HTML → PDF (pure Python, cross-platform).
  # xhtml2pdf transitively pulls reportlab + html5lib.
  "markdown>=3.7,<4.0",
  "xhtml2pdf>=0.2.16,<1.0",
  # Attachment text extraction (pure Python, no heavy/system deps, reliable
  # Cyrillic): pypdf for .pdf text layer, python-docx for .docx.
  "pypdf>=6.0,<7.0",
  "python-docx>=1.1,<2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.5,<9.0",
  "httpx>=0.28.0,<1.0",
  "ruff>=0.15,<1.0",
  "uv>=0.11,<1.0",
]
# Harness-агенты в Docker-песочнице (Ф2+). Опционально: без docker система
# полностью работает (LLM-путь, stub-harness), CI зелёный без Docker.
# Лениво импортируется в DockerSandboxRuntime; отсутствие → понятная ошибка.
harness = [
  "docker>=7,<8",
]

[project.scripts]
povgen = "pov_generator.interfaces.cli:main"
povgen-api = "pov_generator.interfaces.api:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
# Минимальный набор: ошибки pyflakes (F), unused imports/vars,
# обычные стилистические (E) и import order (I).
# Стиль существующего кода не правим — этот конфиг ловит только
# действительно мусорные вещи.
select = ["F", "E", "W", "I"]
ignore = [
  "E501",  # длинные строки — у нас уже много кириллических комментариев
  "E731",  # lambda — иногда удобнее именованного def
  "E402",  # module level import not at top — для тестовых заглушек
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E731", "E402"]
"src/pov_generator/application/execution_service.py" = ["E501"]
