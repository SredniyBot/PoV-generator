kind: task_template
id: common.prepare_requirements_spec
version: 1.0.0
title: Подготовить техническое задание
type: composite
status: active

children:
  - id: request
    task: common.analyze_request@1.0.0

  - id: business
    task: common.build_business_understanding@1.0.0

  - id: data
    task: common.analyze_data@1.0.0

  - id: solution
    task: common.analyze_solution@1.0.0

  - id: delivery
    task: common.define_delivery_model@1.0.0

  - id: spec
    task: common.compose_requirements_spec@1.0.0

  - id: review
    task: common.review_requirements_spec@1.0.0

slots:
  - id: spec.domain_sections
    title: Доменные разделы ТЗ

  - id: review.domain_gates
    title: Доменные проверки итогового ТЗ

completion:
  when:
    children: all_required_completed
    gates: all_required_passed
  artifacts:
    require_in_subtree:
      - common.requirements_spec@1.0.0
      - common.review_report@1.0.0
