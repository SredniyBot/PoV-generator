kind: task_template
id: common.identify_data_sources
version: 1.0.0
title: Выявить источники данных
type: leaf
status: active

complexity: standard
executor: llm

requires:
  state:
    - business_request
  artifacts:
    optional:
      - common.request_facts@1.0.0
      - common.normalized_request@1.0.0

produces:
  artifact: common.data_sources@1.0.0   # только основной артефакт; reasoning_artifact и methodology_trace генерируются wrapper'ом методологии

context:
  include:
    - state.business_request
    - artifact.common.request_facts
    - artifact.common.normalized_request
  max_artifacts: 4
  overflow: trim_optional

instruction: prompts/common/identify_data_sources.md

# Опциональная политика — только специфика этой задачи.
# Общая методологическая часть приходит из активного methodology_pack.
clarification_policy:
  may_generate_candidates: true
  ask_when:
    - missing_critical_input
  default_blocking_scope: task

validation:
  schema: strict
  semantic:
    min_confidence: 0.45
    clarification_candidates: route_to_coordinator
